  - id: ISSUE-007
    title: BAV 기여표 판본 검증 미실시
    status: 해결
    blocking: false
    resolved_note: >
      BPHS-San Vol.2 Ch.66 원본 대조로 4개 행 교정 후 JHora 와 완전 일치.
        달표   : 달 행 +9 / 화성 행 -9 / 목성 행 12→2  (원전 책 p.847)
        금성표 : 화성 행 5→4                            (원전 책 p.852)
      교정 후 7개 표 전부 12/12, SAV 12/12 일치.
    method: >
      원전은 Karanaprada(흉점) 형식이므로 12하우스에서 여집합을 취해 길점으로 변환했다.
      원전 텍스트의 기여자 목록과 표의 도트 수 열이 상호 검산되어(달 47 / 금성 44)
      판독 신뢰도를 확보했다.
    detection_chain: >
      1. 체크섬은 7개 표 모두 통과 — 개수는 처음부터 맞았다
      2. JHora SAV 대조에서 3칸 불일치, 차이 합 0 — 위치 오류 확인
      3. 행성별 BAV 대조로 달·금성 두 표로 좁힘
      4. 산술로 후보 행 5개까지 좁혔으나 확정하지 않고 원전 확인
      5. 원전이 후보 중 목성 12→2, 화성 5→4 를 확정. 추가로 2개 행 더 발견
      4단계에서 임의로 하나를 골랐다면 달표의 나머지 2개 행 오류는 남았을 것이다.
    lesson: >
      개수 체크섬은 위치 오류를 검출하지 못한다. 외부 대조가 유일한 검증 수단이며,
      대조 도구의 판독 자체도 검증이 필요하다 — 저해상도 이미지에서 6/8/9/0 오독으로
      한 차례 잘못된 진단이 발생했고 확대 캡처로 정정되었다.


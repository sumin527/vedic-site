  - id: ISSUE-023
    title: 컨디션 카테고리 — 재료 부족으로 성립 여부 재검토
    status: 해결
    blocking: false
    resolved_note: >
      운영자 결정으로 §5.4 폐지, 신체 부위·상태·증상 서술 허용(v0.18.0).
      15_하우스6.md 의 사용 가능 범위가 크게 확대되어 카테고리 유지.
      단 §5.1 S3 와 §4.1 근거 게이트는 유지되므로 근거가 얇은 신체 주장은
      강등되어 표시된다. condition_category_assessment.md 의 "사용 불가" 목록은
      §6.3 과 S3 귀결 항목을 제외하고 무효화되었다.
    evidence: >
      15_하우스6.md 실측 평가 결과(condition_category_assessment.md):
        사용 불가 6개 절 — §5.1 트리도샤(신경계·순환기·간·심장·호흡기),
        §5.2 칼라푸루샤(12사인 신체 부위 매핑), §6.3 병증 확정 절차,
        §3.4 병증 조합, 헤더 카라카 4종(상해·만성질환·중독·감염), §4.5 AV 병증 판정
        확보 가능 계열 — 최대 2~3개, 확실한 것 1개
        statement_policy 적용 시 대부분 withheld 로 귀결
      추가로 91_민감표현_치환표.md §2(건강·수명)가 condition_category_policy 와
      전제가 상충한다. 치환표는 "완곡 전달", 정책은 "미전달" 이다.
    options:
      - id: 제외_후_재배치
        detail: >
          카테고리 4개 → 3개(커리어·금전·연애).
          부채 조합은 금전으로, 소송·적·경쟁은 커리어로, 극복력·비파리트는 공통 흡수.
          버리는 재료 없음. s3_risk: high 카테고리 제거. 제작 시간 감소.
      - id: 극도로_좁힌_유지
        detail: >
          에너지 배분·생활 리듬·회복 국면만. 상품 설명에 "질병·신체 미취급,
          대부분 판단 보류 표시 가능" 을 명시. 추가금 대상으로는 부적합.
    recommendation: 제외_후_재배치

  - id: ISSUE-024
    title: 20 §7.4 아쉬타카바르가 임계값 오표기 및 중복 정의
    status: 교정적용
    blocking: false
    detail: >
      20 §7.4 는 "11H BAV 30점 이상 / 35점 이상" 이라고 기술하나 BAV 는 0~8 범위다.
      30·35 는 SAV 수치이며 라벨이 뒤바뀌었다. 같은 절 말미에 SAV 를 따로 언급하는
      것으로 보아 전사 오류로 판단된다.
      SAV 로 읽어도 43 §5.2 (31~35 강한 하우스 / 35~57 매우 강함) 와 어긋난다.
      ISSUE-001(19 §7.5 vs 43 §5.2) 과 동형의 임계값 중복 정의다.
    action: >
      constants.yaml 의 ashtakavarga.sav_grades 를 단일 기준으로 사용한다.
      20 §7.4 의 30/35 는 근거로 쓰지 않는다.


  tie_behavior: emit_warning_do_not_reorder
  career_indicator: AmK                  # 44 §4.1
  rahu_effective_degree_formula: "30.0 - degree_in_sign"
  rahu_status: 검증대기                   # 44 §2.2 — scheme 7 에서는 미사용
  record_scheme_in_output: true          # 44 §2.2 요구


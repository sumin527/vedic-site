  - id: ISSUE-017
    title: 삽타바르가에 D10 이 포함되지 않음 — 커리어 리포트 T3 근거 부적합
    status: 해결
    blocking: false
    resolved_note: >
      다샤바르가(10분할) 채택. D10 에 1.5 배정되며 ISSUE-016 이 v1 경로에서 제외된다.
      대가로 D16·D60 계산 구현이 필요해졌다 — ISSUE-018.
    superseded_options:
      - "삽타바르가 유지 + D10 별도 병기 (미채택)"
      - "Vimsopaka 제외하고 D10 배치만 T3 로 사용 (미채택, 파일럿 1회차 방식)"
    detail: >
      원전 p.97 표 확인 결과 삽타바르가 7분할은 D1 D2 D3 D7 D9 D12 D30 이며
      D10(다샴샤)이 없다. 커리어 리포트의 T3(바르가) 근거로 삽타바르가 Vimsopaka 를
      쓰면 정작 커리어 차트인 D10 이 0점으로 빠진다.

karaka:
  scheme: 7                              # 44 §1.1 프로젝트 기본값
  scheme_variant: knrao_no_pik           # "7" 만으로는 특정되지 않는다 — 아래 참조
  scheme_variant_note: >
    7체계에는 최소 두 종류가 있다.
      (a) No PiK — 라후 제외 + 피트리카라카 제외. K.N. Rao 계열. ← 채택
      (b) PK merged with MK — 다른 배정.
    order 가 [AK, AmK, BK, MK, PK, GK, DK] 인 것은 (a) 와 일치한다.
    대조 소프트웨어에서 (a) 를 선택하지 않으면 AmK 가 통째로 달라지고,
    AmK 는 체크리스트 C1·C2 의 커리어 지표다.
  order: [AK, AmK, BK, MK, PK, GK, DK]
  sort_planets: [sun, moon, mars, mercury, jupiter, venus, saturn]
  sort_key: descending_degree_in_sign

# 4. Vimsopaka Bala (41_BPHS_바르가판독_1_.md §6, 40_BPHS_바르가계산_1_.md)
# =============================================================================
vimsopaka:
  max_score: 20.0
  weight_checksum: 20.0                 # 가중치 합은 20 이어야 한다

  # --- 삽타바르가 7분할 가중치 (40_1_ v1.1 교정본) ---
  saptavarga_weights:                   # 7분할: D1 D2 D3 D7 D9 D12 D30 (D10 미포함 — ISSUE-017)
    d1:  5.0                            # 원전 확인 완료
    d2:  2.0                            # 원전 확인 완료
    d3:  3.0                            # 원전 확인 완료
    d7:  2.5                            # ← ISSUE-016 원전과 불일치
    d9:  4.5                            # ← ISSUE-016 원전과 불일치
    d12: 2.0                            # ← ISSUE-016 원전과 불일치
    d30: 1.0                            # ← ISSUE-016 원전과 불일치
    status: 순열충돌_v1미사용
    source_printed:                     # BPHS-San Vol.1 Ch.7, 책 p.97 / PDF p.96 (원본 확인)
      d1: 5.0
      d2: 2.0
      d3: 3.0
      d7: 1.0
      d9: 2.5
      d12: 4.5
      d30: 2.0
    note: >
      D1·D2·D3 은 양측 일치(합 10.0, derived_constraint 예측과 정확히 일치).
      D7·D9·D12·D30 네 값이 서로 자리를 바꾼 순열 관계이며 양쪽 모두 합이 20.0 이라
      체크섬으로 검출되지 않는다. ISSUE-016 결정 전까지 이 값을 리포트에 쓰지 않는다.

  # --- 채택: 다샤바르가 10분할 (커리어 v1 의 T3 근거) ---
  active_scheme: dasavarga              # ISSUE-017 결정. saptavarga 는 v1 경로에서 미사용
  active_scheme_rationale: >
    원전 p.97 Notes 는 Shadvarga/Saptavarga/Dasavarga/Shodasavarga 중
    "점성가가 고려하는 것"으로 계산한다고 명시하여 선택을 맡긴다.
    커리어 판정에 D10 이 빠진 집합을 쓰는 것은 그 원칙에 어긋나므로 다샤바르가를 채택.
    부수 효과: 다샤바르가는 10개 중 8개가 1.5 동일값이라 순열 충돌(ISSUE-016)이
    구조적으로 성립하지 않는다.
  dasavarga_weights:
    d1:  3.0
    d2:  1.5
    d3:  1.5
    d7:  1.5
    d9:  1.5
    d10: 1.5                            # ← 삽타바르가에는 없는 항목
    d12: 1.5
    d16: 1.5                            # Kalamsa
    d30: 1.5
    d60: 5.0                            # Shastiamsa
    status: 채택
    source: "BPHS-San Vol.1 Ch.7, 책 p.97 — Dasa Varga 열 (원본 이미지 확인)"
    note: >
      합 20.0 검산 완료. D1=3.0, D60=5.0 을 제외한 8개가 모두 1.5 로 동일.
      구현 선행 조건: D16(Kalamsa)·D60(Shastiamsa) 계산 규칙 — ISSUE-018.

  # --- 등급표 (41_1_ §6.2). 소수 경계 → 개·폐구간 명시 ---
  grades:
    - { min: 17.5, max: 20.0, label: Atipoorna,  pct: [87.5, 100.0], max_inclusive: true }
    - { min: 15.0, max: 17.5, label: Poorna,     pct: [75.0, 87.5] }
    - { min: 12.5, max: 15.0, label: Atimadhya,  pct: [62.5, 75.0] }
    - { min: 10.0, max: 12.5, label: Madhya,     pct: [50.0, 62.5] }
    - { min: 7.5,  max: 10.0, label: Swalpa,     pct: [37.5, 50.0] }
    - { min: 5.0,  max: 7.5,  label: Atiswalpa,  pct: [25.0, 37.5] }
    - { min: 2.5,  max: 5.0,  label: Heena,      pct: [12.5, 25.0] }
    - { min: 0.0,  max: 2.5,  label: Atiheena,   pct: [0.0, 12.5] }

  # --- 고객용 변환 구간 (41_1_ §6.3) ---
  report_bands:
    - { min: 15.0, max: 20.0, key: stable,   max_inclusive: true }
    - { min: 10.0, max: 15.0, key: variable }

      충돌 자체는 미해결이나 v1 발행을 막지 않는다. 삽타바르가를 다시 쓸 때 재개할 것.
    detail: >
      원전 p.97 : D7=1.0  D9=2.5  D12=4.5  D30=2.0
      KB v1.1   : D7=2.5  D9=4.5  D12=2.0  D30=1.0
      네 값이 서로 자리를 바꾼 순열이며 양쪽 모두 합이 20.0 이라 체크섬으로 검출 불가.
      D1·D2·D3 은 양측 일치.
    consideration: >
      KB 쪽은 나밤샤(D9)에 최고 가중치를 주며 이는 실무 통용 배분과 일치한다.
      원전은 D12 에 4.5 를 준다. 판본 차이일 수 있으므로 오류로 단정하지 않는다.
    action: >
      40_1_ v1.1 개정 로그에서 교정 근거를 확인. 근거가 있으면 §1.6 병기,

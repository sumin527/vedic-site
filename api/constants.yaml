# 8-B. 길성·흉성 판정 (00_방법론_하우스판단_원칙.md §2·§3)
# =============================================================================
benefic_malefic:
  # 두 계층을 병기한다 (§1.6). 하나로 합치지 않는다.
  layers:
    natural:
      grade: 원전
      note: >
        BPHS 슬로카의 "길성(shubha)·흉성(papa)" 은 같은 원전 전통 안에서 해석한다.
        HTJH1 의 기능 길흉을 BPHS 조건문에 대입하면 슬로카가 말하는 바가 바뀐다.
      benefic: [jupiter, venus, mercury, moon]
      malefic: [saturn, mars, sun, rahu, ketu]
      conditional:
        mercury: "흉성과 결합하면 흉성으로 작용"
        moon: "상현(waxing) 길성 / 하현(waning) 흉성"
      applies_to: ["47_노드다샤_판독규칙.md 의 길성·흉성 조건"]

    functional:
      grade: 실전서
      source: "00_방법론_하우스판단_원칙.md §2·§3 (HTJH1 Ch.2)"
      note: "라그나별 판정. 보조 계층으로만 사용하고 BPHS 조건문에 대입하지 않는다."
      general_rules:
        benefic: ["라그나 로드(달 제외)", "5·9로드 (9 > 5)", "4·7·10로드가 자연 흉성일 때 (10 > 7 > 4)"]
        malefic: ["3·6·11로드 (11 최악 > 6 > 3)", "켄드라 로드가 자연 길성일 때 (Kendradhipati Dosha)"]
        neutral: ["달이 라그나 로드", "태양·달이 8로드", "태양·달이 2·12로드"]
      reversal_rule: >
        켄드라 소유로 흉성이 된 자연 길성이 자기 소유 켄드라에 재실하면 흉 작용이 해제된다.
        역도 성립한다.
      by_lagna:                          # 사인번호: {benefic, malefic, neutral}
        1:  { benefic: [jupiter, sun, mars],          malefic: [mercury, saturn, venus], neutral: [], unclassified: [moon] }
        2:  { benefic: [saturn, mercury, mars, sun],  malefic: [jupiter, moon],          neutral: [venus] }
        3:  { benefic: [venus],                       malefic: [mars, jupiter, sun],     neutral: [moon, mercury], unclassified: [saturn] }
        4:  { benefic: [mars, jupiter],               malefic: [venus, mercury],         neutral: [saturn, moon, sun] }
        5:  { benefic: [mars, sun],                   malefic: [mercury, venus],         neutral: [jupiter, moon, saturn] }
        6:  { benefic: [venus],                       malefic: [moon, mars, jupiter],    neutral: [saturn, sun, mercury] }
        7:  { benefic: [saturn, mercury, venus],      malefic: [sun, jupiter, moon],     neutral: [mars] }
        8:  { benefic: [moon, jupiter, sun],          malefic: [mercury, venus],         neutral: [mars, saturn] }
        9:  { benefic: [mars, sun],                   malefic: [venus, saturn, mercury], neutral: [jupiter, moon] }
        10: { benefic: [venus, mercury, saturn],      malefic: [mars, jupiter, moon],    neutral: [sun] }
        11: { benefic: [venus, sun, mars],            malefic: [jupiter, moon],          neutral: [mercury], unclassified: [saturn] }
        12: { benefic: [moon, mars],                  malefic: [saturn, sun, venus, mercury], neutral: [jupiter] }
      unclassified_note: >
        00_방법론 §3 원본 표에 누락된 항목이다. 검증기가 7행성 분류 검사에서 검출했다.
        §6.1 에 따라 임의로 채우지 않고 공백으로 유지한다.
        §2 일반 규칙을 적용하면 후보가 나오나 확정되지 않는다 —
          양자리 달   : 4로드. 자연 길성의 켄드라 소유 = Kendradhipati Dosha 후보
          쌍둥이 토성 : 8·9로드. 트리코나(길)와 두스타나(흉)가 겹쳐 §2 로 미해결
          물병 토성   : 1·12로드. 라그나 로드(길)와 12로드가 겹침
        판정에서 이 조합을 만나면 기능 길흉을 적용하지 않고 자연 길흉만 쓴다.
        → ISSUE-035

      strongest:                          # ◎ 표시 — 라그나별 최고 길성
        2: saturn
        3: venus
        4: mars
        5: mars
        6: venus
        7: saturn
        8: moon
        10: venus
        11: venus
        1: jupiter
      worst:                              # ✕ 표시 — 라그나별 최악 흉성
        1: mercury
        3: mars
        10: mars

  yogakaraka:                             # §4 — 켄드라·트리코나 동시 소유
    4:  mars      # 게 — 5·10로드
    5:  mars      # 사자 — 4·9로드
    2:  saturn    # 황소 — 9·10로드
    7:  saturn    # 천칭 — 4·5로드
    10: venus     # 염소 — 5·10로드
    11: venus     # 물병 — 4·9로드
    note: "화성·토성·금성만 요가카라카가 될 수 있다. 47 §4.1 라후 조건 A 평가에 사용."

# =============================================================================
# 8-C. 보충 원전 정책 (supplementary sources)
# =============================================================================
# 운영자 결정 — BPHS 에 규정이 없을 때 다른 고전을 끌어와 채운다.
supplementary_sources:
  enabled: true
  rationale: >
    BPHS 단독으로는 판정 불가 구간이 남는다. 다른 고전 원전으로 채우면 커버리지가 늘고,
    §7 출처등급상 여전히 원전 등급을 유지할 수 있다.

  accepted:
    - id: brihat_jataka
      full: "Brihat Jataka (Varahamihira)"
      grade: 원전
      note: "Santhanam 이 BPHS 역주에서 참조로 인용하는 텍스트. N.C. Iyer 1885 영역본 공개."
    - id: saravali
      full: "Saravali (Kalyanavarman)"
      grade: 원전
      caveat: "다샤 계열은 물라 다샤이므로 빔쇼타리와 혼용 금지 (§1.6)"
    - id: phaladeepika
      full: "Phaladeepika (Mantreswara)"
      grade: 원전
      caveat: "고차라는 잔마라시 기준이라 이중 트랜짓 모델과 판본 충돌 — timing 에 미사용"

  guardrails:                             # §1.6 을 지키기 위한 필수 조건
    - "출처를 규칙마다 명시한다. 어느 텍스트에서 왔는지 추적 가능해야 한다"
    - "BPHS 규칙과 하나로 합치지 않는다 — 병기한다 (§1.6)"
    - "같은 결론을 BPHS 와 보충 원전이 함께 지지해도 계열은 하나로 센다 (§9.1)"
    - "보충 원전이 BPHS 와 상반되면 §4.3 에 따라 병기하고 판정하지 않는다"
    - "역자가 의심을 표한 대목은 채택하지 않는다 (Ch.55 역자주 2건 선례)"

  tier_counting_note: >
    보충 원전은 커버리지를 늘리기 위한 것이지 계열 수를 늘리기 위한 것이 아니다.
    BPHS 와 Brihat Jataka 가 같은 방향을 가리켜도 T4 는 여전히 1계열이다.
    이 구분이 무너지면 ISSUE-002·003·020 에서 막아온 계열 부풀리기가 재발한다.

# =============================================================================
# 9-A. 진술 등급 정책 (statement grading)
# =============================================================================
# 근거가 부족한 결론을 폐기하는 대신 "범주가 다른 진술" 로 강등한다.
# 강등은 약한 판정이 아니다. 종류가 다른 문장이다.
statement_policy:

  levels:
    verdict:                            # 판정
      requires: { min_tiers_excl_av: 3, l1: true, safety: true }
      description: "근거 계열 3개 이상 + L1. §4.1 충족."
      voice: "이 시기에 커리어 전환 가능성이 높습니다"
      report_placement: 본문

    conditional:                        # 조건부
      requires: { min_tiers_excl_av: 2, l1: true, safety: true }
      description: >
        핵심 결론이 아니라 조건부 조언이다. §4.1 은 핵심 결론에 적용되므로
        이 등급은 §4.1 의 완화가 아니라 적용 범위 밖이다.
      voice: "다음 조건이 충족되면 전환을 검토할 만합니다"
      report_placement: 본문_시각적_구분
      constraints:
        - "판정으로 승격 불가 — 추가 근거가 생기면 재판정하되 등급을 임의 상향하지 않는다"
        - "확정 어투 금지 — '~할 것입니다' 대신 '~라면 ~를 검토할 수 있습니다'"
        - "강등 사유를 ⚠️ 이견 및 불확실 사항 섹션에 반드시 기록"
        - "시각적으로 판정과 구분되어야 함 (별도 블록·라벨)"

    divergent:                          # 양면 — 근거가 상반될 때
      requires: { min_tiers_excl_av: 1, opposing_present: true }
      opposing_definition: >
        [v0.41.0 교정] "반대 근거" 는 counts_as_evidence: true 인 계열만 센다.
        아쉬타카바르가는 43 §5.1 에 따라 사건의 종류가 아니라 강도를 나타내므로
        AV 가 낮아도 방향 충돌이 아니다. 지지 쪽에서만 AV 를 제외하고
        반대 쪽에서 제외하지 않으면, AV 하나로 판정이 양면으로 강등되는 오류가 난다.
      modifier_signal: >
        계열이 아닌 지표(AV 등)의 반대는 modifier_oppose 로 분리한다.
        등급에는 영향을 주지 않고, 서술에서 현실화 속도·강도를 낮춰 표현하는 데 쓴다.
      description: >
        근거가 없어서가 아니라 근거들이 서로 다른 방향을 가리켜서 하나로 좁혀지지 않는 경우다.
        판정도 보류도 아니다. 양쪽을 다 서술하고 그 긴장 자체를 결론으로 삼는다.
      voice: >
        조건절 구조. "~하기 쉽습니다. 다만 ~합니다. ~라면 A, ~라면 B" 형태.
        대칭 구조("한쪽에서는 / 다른 쪽에서는")는 사용하지 않는다 — 도식적으로 읽힌다.
      narration_form: conditional_clause
      narration_form_note: >
        [v0.40.0 — 독자 피드백 반영] 초기 대칭 구조는 divergent 라는 내부 등급을
        문장 형식으로 그대로 옮긴 것이었다. 등급명은 서술층에 넘기지 않기로 했는데
        (internal_only_fields) 구조가 새어 나간 셈이다.
        조건절 구조로 바꾸되, 조건부와 구별되는 요소를 반드시 남긴다.
      required_elements:                # narration_check 가 강제하는 3요소
        - "전환 — 첫 방향 뒤에 반대 방향으로 넘어가는 지점 (다만·그런데·반면 등)"
        - "판별 갈림길 — 독자가 자기 경우를 가릴 분기 2개 이상 (~라면 / ~다면)"
        - "분기별 귀결 — 어느 쪽이냐에 따라 조언이 달라짐"
      vs_conditional: >
        조건부 = 주장 + 단서. 양면 = 주장 + 단서 + 판별 갈림길.
        문장 표면은 비슷하게 읽히지만, 양면에는 독자가 자기 경우를 판별하고
        그에 따라 다른 조언을 받는 분기가 들어간다. 이 분기가 없으면
        양면이 조건부로 퇴화하고 게이트가 등급을 나누는 의미가 사라진다.
      report_placement: 본문_양면서술
      constraints:
        - "한쪽을 선택해 서술하지 않는다 — 선택하면 divergent 가 아니라 verdict 다"
        - "양쪽의 조건을 함께 제시해 고객이 자기 상황에 대입할 수 있게 한다"
        - "대칭 구조(한쪽/다른 쪽)를 쓰지 않는다 — 내부 등급 구조의 유출이다"
        - "확정 어투 금지. 다만 '모르겠다' 로 끝내지 않는다"
        - "부록에 어느 근거가 어느 방향이었는지 기록"
      rationale: >
        상반된 근거를 만났을 때 임의로 한쪽을 택하면 §4.3(반대 근거를 숨기지 않는다) 위반이고,
        판단을 접으면 고객에게 아무것도 남지 않는다. 양쪽을 다 말하는 것이 정직하면서도
        유용한 유일한 길이다. 실무적으로도 "조건에 따라 갈린다" 는 정보가
        "강하다" 는 단정보다 행동에 도움이 되는 경우가 많다.

    withheld:                           # 보류
      requires: { min_tiers_excl_av: 1 }
      description: "근거 부족을 명시하고 판단하지 않는다."
      voice: "이 항목은 근거 부족으로 판단을 보류합니다"
      report_placement: 이견_및_불확실_사항_섹션
      constraints:
        - "보류 사유(어느 계열이 왜 비었는지)를 함께 적는다"
        - "그럴듯한 문장으로 빈 자리를 채우지 않는다"

    silent:
      requires: { min_tiers_excl_av: 0 }
      description: "근거가 전무하면 언급하지 않는다."
      report_placement: 미출력

  anti_loophole: >
    강등은 게이트의 우회로가 아니다. conditional 은 verdict 의 약한 버전이 아니라
    다른 종류의 진술이며, 리포트에서 시각적으로 구분되고 사유가 공개되어야 한다.
    이 세 조건이 지켜지지 않으면 강등 정책은 §4.1 을 무력화한다.

  rationale: >
    근거 부족 시 결론을 전량 폐기하면 리포트가 성립하지 않고(파일럿 1회차 0/3),
    규칙 공백(ISSUE-013·014)이 발행 차단 요인으로 고착된다.
    강등하면 공백이 "차단" 이 아니라 "명시된 한계" 가 되며, 이는 감사가능성
    포지셔닝을 약화시키는 것이 아니라 강화한다.

# =============================================================================
# 9-A-2. 출력 계약 (문장 단위 감사 추적)
# =============================================================================
output_contract:

  # --- 리포트 3층 구조 (v0.44.0) ---
  layers: [judgment_input, author_draft, narration_input]
  layers_note: >
    판정층 → 작성자 검토본 → 고객 발송본. 각 층은 앞 층에서 정보를 덜어내는 방향으로만
    간다. 작성자는 원문에 가까운 서술을 보고 무엇을 완곡화할지 직접 판단한다.
    걸러진 결과만 보면 걸러진 것이 옳은지 검증할 수 없다.

  author_draft:
    audience: operator_only
    delivery: never_to_client
    purpose: >
      완곡화·삭제 판단을 작성자가 직접 내리기 위한 층이다.
      최종본에서 무엇이 왜 빠졌는지 추적 가능해야 한다.
    includes:
      - "원전 서술 원문 (완곡화 이전)"
      - "확정 병명 등 최종본 미사용 항목"
      - "신체 부위·계통 상세, 칼라푸루샤 매핑 전체"
      - "근거 계열·규칙 ID·참조 문서와 절"
      - "SAV·BAV 원점수, Vimsopaka 점수"
      - "statement_policy 등급명과 판정 사유"
      - "최종본에서 제외한 항목과 제외 사유"
    excludes:
      - "정신 건강 상태 진술 — 존재 사실만 알리고 내용은 옮기지 않는다"
    mental_health_handling:
      rule: existence_notice_only
      notice_template: >
        [작성자 전용] {배치}에 정서 관련 서술이 원문에 있습니다.
        본 리포트에서는 생활 패턴 수준까지만 사용했습니다.
        원문 확인이 필요하면 {출처}를 직접 보세요.
      rationale: >
        (1) 원본 신뢰도 — 고전의 정서 관련 서술은 신체 부위 매핑처럼 조건-결론이
        명확하지 않고 성향을 뭉뚱그린 표현에 가깝다. 정확도가 낮은 정보를 정확한
        정보처럼 제시하면 작성자의 판단을 오염시킨다.
        (2) 비가역성 — 작성자가 차트 주인을 알거나 알게 되면, 읽은 사실이 남아
        그 사람을 보는 시선에 영향을 준다. 최종본에서 제외해도 되돌릴 수 없다.
        병명은 이 문제가 없으나 정신 건강 진술은 있다.
      operator_choice: >
        존재 사실을 알리므로 작성자가 원문을 직접 확인할 선택권은 유지된다.
        자동으로 옮기지 않을 뿐이다.

  # --- 리포트 2부 구성 (v0.31.0 결정) ---
  report_structure: body_plus_appendix
  report_structure_note: >
    본문은 결론과 조언만 담는다. 판단 근거는 부록으로 분리한다.
    근거는 작성자에게 필요한 것이지 고객이 읽어야 하는 것이 아니다.
    다만 "얼마나 확신하는가" 는 본문에 남는다 — 조건부 어투, 반대 신호,
    보류 표시는 근거가 아니라 정직성의 표현이며 statement_policy 의 결과다.

  body:
    includes:
      - "결론 서술 (등급에 맞는 어투)"
      - "실행 가능한 조언"
      - "조건부 항목의 조건 명시"
    excludes:
      - "근거 계열 이름·개수 (T1·T5 등)"
      - "문서·절 인용 (19 §1 등)"
      - "점성술 기제 (10로드·요가명·SAV 등)"
      - "등급명 (verdict / conditional / withheld)"
      - "수치 일체"

  # --- 보류 항목 처리 (v0.32.0) ---
  withheld_disclosure:
    body_mention: false                 # 본문에 언급하지 않는다
    body_mention_rationale: >
      "판단을 보류했습니다" 를 본문에 적으면 고객은 자기가 못 받은 것을 인지하게 되고,
      결론이 아니라 결손이 남는다. 언급하지 않으면 그 항목이 있었는지 알지 못한다.
      규칙 공백이 해소되면 그때부터 자연스럽게 포함된다.
    appendix_record: true               # 부록에는 남긴다 (§6.3 최소 이행)

    upsell_phrasing_rule: >
      "상세 진행 시 안내드립니다" 류 문구는 기본 범위에서 의도적으로 제외한 항목에만 쓴다.
      규칙 공백(ISSUE-013 노드 다샤 등)으로 판단이 불가능한 항목에는 쓰지 않는다.
      추가금을 결제해도 제공할 수 없는 것을 유도하는 것이 되기 때문이다.
      tiering.prohibited_addon_pattern 과 같은 취지다.

    classification:
      out_of_scope:                     # 기본에서 안 하기로 한 심화 분석
        body: "상세 진행 시 안내드립니다"
      rule_gap:                         # 규칙 부재로 판단 불가
        body: null                      # 언급하지 않음
        appendix: "판단 근거를 확보하지 못해 이번 리포트에서 다루지 않았습니다"
      no_signal:                        # 차트에 신호 없음
        body: null

  appendix:
    title: "판단 근거 요약"
    default_state: collapsed            # 접힌 상태로 제공. 원하는 고객만 펼친다
    rationale: >
      대부분의 고객은 열어보지 않는다. 그러나 부록이 존재한다는 사실 자체가
      신뢰 신호이며, 검증을 원하는 고객에게 답이 된다. 본문 가독성은 유지된다.
    includes:
      - "차트 사실 (배치·요가 성립 등 고객이 대조 가능한 정보)"
      - "반대 방향 신호 (§4.3) — 결론 언어로"
      - "다루지 않은 항목 (§6.3) — 사유는 한 줄로"
      - "이 해석이 빗나갈 수 있는 조건"
      - "계산 설정 (재현성 추적)"
    excludes:
      - "참조 문서명·절 번호 — 고객이 원문을 갖고 있지 않아 무의미"
      - "근거 계열 이름 (T1·T5 등)"
      - "SAV·BAV 원점수, Vimsopaka 점수 (internal_only_fields 유지)"
      - "statement_policy 등급명"
    excludes_rationale: >
      부록의 목적은 고객이 검증할 수 있게 하는 것이다. 참조 문서명은 고객이
      원문을 갖고 있지 않으므로 검증 수단이 되지 못하고 전문 용어 나열로만 읽힌다.
      반면 차트 사실은 다른 소프트웨어로 대조 가능하므로 검증 수단이 된다.

  statement_format: [fact, claim, disclosure]
  statement_format_placement:
    fact: appendix                      # 차트 사실 — 본문에서 제외
    claim: body                         # 결론 서술 — 본문
    disclosure: body_and_appendix       # 한계는 본문에 완곡히, 상세는 부록
  applies_to: [verdict, conditional]    # withheld 는 사유만 기록

  fields:
    fact: >
      차트에서 기계적으로 확인되는 정보만. 해석 없음.
      예: "10하우스 로드 토성이 염소자리 10하우스"
    claim: >
      해당 사실에 대한 베딕 해석. 참조 문서·절을 함께 표기한다.
      예: "자기 사인·자기 하우스 배치 — 커리어 지향 강화 (19 §1)"
    disclosure: >
      해석의 한계, 반대 근거, 추가 확인이 필요한 조건.
      예: "D9·D10 에서는 반복되지 않음. 분할차트 강도는 별도 검증 필요"

  conflict_template:                    # §4.3 · §1.6 의 출력 형식
    fields:
      - "BPHS 관점"
      - "Saravali 관점"
      - "실전서 관점"
      - "충돌 지점"
      - "종합 판단"
      - "추가 확인이 필요한 입력"
    note: >
      §4.3 은 "병기한다" 는 원칙만 있고 출력 형식이 없었다. 이 템플릿이 그 형식이다.
      §7 출처등급 3층(원전 BPHS / 원전 Saravali / 실전서)이 출력에서 그대로 분리된다.

  falsification_required: true
  falsification_field: "이 해석이 빗나갈 수 있는 조건"
  falsification_placement: appendix     # v0.31.0 — 본문에서 부록으로 이동
  falsification_note: >
    부록 필수 항목. 본문에 두면 방어적으로 읽히지만, 부록에서는 성실함의 표시가 된다.
    해석이 성립하지 않게 되는 구체적 조건을 적는다.

  uncertainty_section:                  # §6.3 ⚠️ 이견 및 불확실 사항
    body_form: >
      결론 수준으로만. 예 — "커리어의 구체적 시기는 이번 리포트에서 판단을 보류했습니다."
      어느 계열이 왜 비었는지는 본문에 쓰지 않는다.
    appendix_form: >
      상세 사유. 미충족 계열, 규칙 공백 이슈, 반대 근거 전문.

  prohibited_expressions:
    - "반드시"
    - "무조건"
    - "100%"
    - "운명적으로"
    - "틀림없이"
    - "확정"
    - "분명히"
    - "당연히"
    - "절대"

  # --- 서술층 설계 (LLM 사용 규칙) ---
  narration:
    generator: llm
    reviewer: human                      # 무인 발송 금지
    review_required_before_delivery: true

    closed_input: true
    closed_input_rule: >
      LLM 에게 지식베이스 .md 문서를 제공하지 않는다. 판정층이 생성한 구조화 JSON 만
      입력한다. 문서를 보지 못하면 거기 있는 규칙을 인용할 수 없으므로,
      LLM 의 작업이 "해석" 에서 "번역" 으로 축소된다. 이것이 오차 통제의 핵심 장치다.

    internal_only_fields:                # 서술층에 넘기지 않는다 (ISSUE-020)
      - "62 §6 직업 기능 점수"
      - "SAV·BAV 원점수"
      - "Vimsopaka 점수"
      - "근거 계열 개수"
      - "statement_policy 등급명"
    internal_only_note: >
      점수·등급·개수는 판정층 내부에서 순서와 강도를 정하는 데만 쓰고 서술층에 넘기지 않는다.
      62 §6 이 스스로 "점수는 내부 우선순위이며 성공을 보장하는 확률값이 아니다" 라고 명시한다.
      넘기지 않으면 narration_check 의 numeric_leak 검사가 구조적으로 유출을 차단한다.
      결과적으로 리포트 본문에 수치가 등장하지 않는다.

    block_scope: per_conclusion          # 리포트 전체를 한 번에 생성하지 않는다
    block_scope_rule: >
      결론 1개당 1회 생성. 긴 문서를 한 번에 쓰게 하면 검증이 불가능해지고
      블록 사이에 근거 없는 연결 문장이 삽입된다.

    field_ownership:
      fact: template                     # 차트 사실 — LLM 미개입
      claim: llm                         # 결론코드에 묶인 해석 문장
      disclosure: llm_then_human         # 한계·반대 근거. 사람이 최종 확인
      falsification: human               # 반증 조건은 사람이 작성

    llm_settings:
      temperature: 0
      note: >
        temperature 0 이 재현성을 보장하지는 않는다. 재현성은 판정층이 담보하고,
        서술층은 사후 검사와 사람 승인으로 담보한다. 서로 다른 장치다.

    post_checks:                          # narration_check.py 가 수행
      - prohibited_expression             # 금지 표현 문자열 검출
      - s3_keyword                        # S3 어휘 검출
      - numeric_leak                      # 입력 JSON 에 없는 수치 검출
      - term_leak                         # 입력 JSON 에 없는 점성 용어 검출
      - conditional_voice                 # conditional 블록의 확정 어투 검출
      - citation_integrity                # 입력에 없는 문서·절 인용 검출
      - cross_tradition                   # 타 전통 용어 검출 (§1.1)

    fail_action: block                    # 하나라도 걸리면 발송 차단, 재생성 또는 수기 수정

  s3_keywords:                            # 서술층 하드 차단 어휘
    # 91_민감표현_치환표.md §9 자동 필터 어휘 병합
    - 사망
    - 죽음
    - 단명
    - 수명
    - 임종
    - 사별
    - 타살
    - 자살
    - 이혼
    - 별거
    - 중병
    - 불치
    - 암
    - 불임
    - 유산
    - 파산
    - 감옥
    - 범죄
    - 저주
    - 악인
    - 음란
    - 신변 위험
    - 마라카

  cross_tradition_terms:                  # §1.1 — 타 전통 용어 차단
    - 십신
    - 격국
    - 용신
    - 조후
    - 신살
    - 대운
    - 세운
    - 일간
    - 오행
    - 사주
    - 명리
    - 에센셜
    - 디그니티
    - 섹트
    - 포르투나

# =============================================================================
# 9-B. 접수 정책 (상품 스펙)
# =============================================================================
intake_policy:

  birth_time:
    required: true
    rejection_rule: >
      출생시각이 없거나 폭이 넓은(예: "새벽쯤") 의뢰는 접수하지 않는다.
    rationale: >
      시각이 없으면 라그나가 없고, 라그나가 없으면 홀사인 하우스가 미정이며,
      evidence_policy.l1_definition (d1_house / d1_lord / d1_occupant) 이 산출되지 않는다.
      §4.1 의 "L1 필수" 를 구조적으로 충족할 수 없으므로 어떤 결론도 게이트를 통과하지 못한다.
      추가로 달은 하루에 약 1 낙샤트라를 지나가므로 출생 다샤 잔량이
      최대 1 낙샤트라만큼 불확실해지고, 타이밍 리포트에서 다샤 경계가 수년 단위로 밀린다.

    rectification: prohibited
    rectification_rationale: >
      역산(rectification)은 실재하는 고전 기법이나 이 상품에서는 사용하지 않는다.
      커리어 사건으로 시각을 맞춘 뒤 그 차트로 커리어를 판정하면 순환논증이 되고,
      §4.1 의 근거 계열 3개가 무의미해진다(이미 답을 알고 맞춰진 차트에서 나오므로).
      상품의 차별점인 판정 절차의 감사가능성을 정면으로 훼손한다.
      또한 차트당 수 시간이 소요되어 비동기 리포트 모델의 단위 경제와 맞지 않는다.

    client_guidance:                     # 시각을 모르는 고객에게 안내할 경로
      - "출산 병원 의무기록 사본 — 분 단위 기록이 남아 있는 경우가 많음"
      - "아기수첩·산모수첩"
      - "출생신고 서류 기재 시각"
      - "가족의 기억 — 단 폭이 30분을 넘으면 사용 불가"
    client_guidance_note: >
      행정 실무는 시기·기관마다 다르므로 확인 항목으로만 안내한다. 법률 자문 아님.

  time_precision:
    boundary_check_required: true
    boundary_check_rule: >
      접수 시 라그나가 사인 경계에서 얼마나 떨어져 있는지 먼저 확인한다.
      경계에 가까우면 시각 오차 ±30분으로도 라그나 사인이 바뀌므로 고객에게 고지한다.
    tolerance_status: 결정대기          # 허용 오차 폭은 상품 스펙에서 확정

  personal_data:
    note: >
      출생 시각·장소는 민감한 개인정보다. 보관 기간과 파기 절차를 상품 스펙에 명시하고,
      테스트 픽스처·리포지토리에는 실제 출생정보를 넣지 않는다.

# =============================================================================
# 9-C. 상품 범위 (product scope)
# =============================================================================
product_scope:
  form: comprehensive                    # 종합형 — 단일 주제 아님
  categories: [career, finance, relationship, condition]

  category_readiness:
    career:
      evidence_map: 완비                 # evidence_checklist.md §1
      dedicated_doc: 62_Saravali_직업판단.md
      s3_risk: low
    finance:
      evidence_map: evidence_map_finance.md
      source_docs: [11_하우스2.md, 20_하우스11.md]
      dedicated_doc: null
      natural_karaka: jupiter            # Dhanakaraka — AmK 공백(ISSUE-014) 영향 없음
      s3_risk: medium                    # ← low 에서 상향. ISSUE-025 참조
      s3_risk_note: >
        2하우스가 재물과 함께 눈·언어·가족을 관장하고 빈곤 조합에 마라카가 개입한다.
        판정 과정에서 S3 내용이 자연스럽게 나오므로 판정 단계 필터가 필요하다.
      tier_strength:
        t1: 두꺼움                       # 11 §1·§2 + 20 §1·§2
        t2: 양호                         # 목성 자연 카라카
        t4: 최상                         # 11 §5 만으로 21개 조합
        t6: 두꺼움                       # 11 §3 부유 13 + 20 §3
    relationship:
      evidence_map: evidence_map_relationship.md
      source_docs: [16_하우스7.md, 44_BPHS_카라카_특수점.md]
      karaka: [venus, jupiter, mars, sun, moon, DK]
      primary_varga: d9                  # 16 헤더 — D1 만으로 부족, D9 병행 필수
      s3_risk: high                      # ← medium 에서 상향
      s3_risk_note: >
        7하우스는 마라카(2·7)이므로 타이밍 작업이 수명 판단 영역에 접근한다.
        또한 별거·이혼·배우자 건강은 문서 자체가 "볼트 지식(리포트 사용 금지)" 로 지정.
      tier_strength:
        t1: 두꺼움                       # 16 §1 12행 + §2 9행 + §5.1 12행
        t2: 최상                         # 자연 카라카 5개 + DK. AmK 공백 영향 없음
        t3: 최상                         # D9 가 결혼 전용 바르가
        t4: 두꺼움                       # 16 §3.1~3.5
        t6: 양호
      vault_only:                        # 문서가 스스로 리포트 사용 금지로 표시
        - "16 §4.5 별거·이혼 지표"
        - "16 §8.5 배우자 건강 판단"
    condition:
      evidence_map: evidence_map_condition.md
      superseded_doc: condition_category_assessment.md   # v0.17.0 평가. "사용 불가" 목록 무효
      assessment: 유지_v0.20.0
      assessment_summary: >
        §5.4 폐지로 15_하우스6.md 의 §5.1 트리도샤, §5.2 칼라푸루샤 신체매핑,
        §3.4 병증 조합, 헤더 카라카 4종이 근거로 사용 가능해졌다.
        §6.3 병증 확정 절차는 결론이 S3 로 귀결되므로 여전히 미사용.
        91_민감표현_치환표 §2(건강·수명)도 사용 가능해졌다.
      remaining_constraint: >
        §4.1 은 유지되므로 칼라푸루샤 단독(사인→신체 1:1 매핑)은 계열 1개로
        withheld 에 머문다. 신체 주장이 판정으로 나가려면 6H로드·6H재실·다샤 등
        복수 계열이 같은 방향을 가리켜야 한다.
      s3_risk: high
      tier_strength:
        t1: 두꺼움                       # 15 §1 12행 + §2 9행
        t2: 양호                         # 화성·토성·라후·케투 4종
        t3: 보통                         # 트리도샤 (전용 바르가 없음)
        t4: 양호                         # 15 §4
        t6: 양호                         # 비파리트 + 병증 조합
      still_blocked:
        - "15 §6.3 병증 확정 절차 — 결론이 심각한 병증 지표 = §5.1 S3 귀결"
        - "확정 병명 (자가면역 질환·성병 등) — 운영자 방침상 병명 미언급"
        - "정신 건강 진술 — active_referral 로 대체 (§2-2)"
        - "S3 어휘 포함 행 — 유산·상실·이혼 위기·감금"
      redistributed_to_other_categories: >
        15_하우스6.md 의 상당 부분이 컨디션이 아닌 다른 카테고리 내용이다.
        부채 조합(§3.2·§5.4·§6.4) → 금전, 소송·적·경쟁(§3.3·§5.3·§6.5) → 커리어,
        루차카 요가 조건(§2 화성) → 커리어. 중복 서술 금지.
      label_note: >
        "건강" 이 아니라 "컨디션·생활 리듬" 으로 명명한다. 제목 자체가 의료적 의미를
        끌어오므로, 실제 서술 범위와 일치하는 이름을 쓴다.
      s3_risk: high

  # --- 맥락 정보 정책 (v0.43.0) ---
  context_policy:
    base: neutral
    base_rule: >
      기본 리포트는 고객의 현재 상태(관계·직업·재정 상황)를 받지 않고 작성한다.
      차트는 "어느 영역이 움직인다" 까지만 말하고 그것이 시작인지 정리인지는
      구분하지 못하므로, 상태를 모르는 채 방향을 단정하면 헛돈다.
      따라서 기본 리포트는 상태에 무관하게 성립하는 서술만 담는다.

    addon: context_based
    addon_rule: >
      카테고리별 상세 리포트 접수 시 최소 맥락을 받는다.
      상담이 아니라 판정 분기용 최소 정보다.

    intake_fields:                     # 상세 리포트 접수 시
      - { id: relationship_status, label: "관계 상태",
          options: [솔로, 연애 중, 기혼, 기타], required_for: [relationship] }
      - { id: work_status, label: "직업 상태",
          options: [재직, 프리랜서, 구직, 사업, 학생, 기타], required_for: [career] }
      - { id: focus, label: "이번에 특히 알고 싶은 것",
          type: free_text, max_length: 200, required: false }

    judgment_unaffected: >
      맥락은 판정 근거가 아니다. 계열 집계와 등급은 차트에서만 나온다.
      맥락은 같은 판정을 어느 방향으로 서술할지에만 쓴다.
      이 구분을 부록에 명시해 "들은 것을 쓴 것" 이라는 의심을 방어한다.

    neutral_writing_rules:             # 기본 리포트 서술 제약
      - "상태를 전제하는 표현 금지 — '새로운 만남', '이직 시', '배우자와' 등"
      - "영역이 움직인다는 사실까지만 서술하고 사건 유형을 특정하지 않는다"
      - "독자가 자기 상태에 대입할 수 있는 형태로 쓴다"
      - "'어떤 조직에서' 같은 경험 전제도 피한다 — 조직 경험이 없을 수 있다"

    example:
      neutral: "관계 영역에 움직임이 생기기 쉬운 시기입니다"
      context_solo: "새로운 관계가 시작될 여지가 있는 시기입니다"
      context_married: "관계의 조율이나 재정비가 필요해지기 쉬운 시기입니다"

  tiering:
    base: >
      전 카테고리를 동일 깊이로 완결한다. 기본 리포트만으로 완결되어야 하며,
      찾은 결론을 유보하고 추가 구매를 유도하지 않는다.
    addon_principle: >
      추가금 상품은 기본에서 다루지 않은 다른 종류의 작업이어야 한다.
      예: 특정 의사결정 1건의 시기 분석, 두 선택지 비교, 후속 질의 1회.
    prohibited_addon_pattern: >
      기본 리포트에서 이미 도출된 결론을 잠그고 추가 결제로 여는 구조.
      근거를 전부 공개한다는 상품 포지셔닝과 정면 충돌한다.
    context_as_addon_justification: >
      맥락 기반 상세는 정당한 추가금 사유다 — 기본에서 도출한 결론을 잠근 것이 아니라,
      기본에서 원리적으로 불가능했던 작업(상태별 분기 서술)을 추가로 하는 것이기 때문이다.
      기본 리포트는 맥락 없이도 완결된다.

  effort_estimate:
    conclusions_per_report: "12~20"
    note: >
      종합형은 §4.1 통과를 쉽게 만들지 않는다. 결론 개수가 늘 뿐 결론 하나당
      3계열 요건은 동일하므로 작업량만 비례 증가한다.
      단일 주제 90분 목표 기준 종합형은 6시간 이상으로 추정되며,
      월 가용 25시간에서 약 4건이 상한이다. 단가 설계 시 이 값을 전제로 한다.

# =============================================================================
# 9-D. 컨디션 카테고리 안전 규칙 (S3 인접 — 최고 위험)
# =============================================================================
condition_category_policy:

  governing_rule: >
    §5.1 은 S3 를 "변환이나 암시로도" 출력하지 않는다고 규정한다.
    "주의할 부분으로 기재" 는 암시에 해당하므로 §5.1 의 적용 대상이다.
    본 정책은 §5.1 을 완화하는 것이 아니라, 그 범위 안에서 무엇이 가능한지 명시한다.

  boundary: s3_and_evidence_gate           # v0.18.0 개정 — 경계가 "구체성" 에서 이동
  boundary_note: >
    §5.4 폐지에 따라 신체 부위·상태·증상 서술을 허용한다.
    통제는 표현의 구체성이 아니라 (1) §5.1 S3 차단과 (2) §4.1 근거 계열 게이트로 한다.
    근거가 얇은 신체 주장은 금지되는 것이 아니라 statement_policy 에 따라
    conditional 또는 withheld 로 강등되어 표시된다.

  allowed:
    - "휴식·수면·생활 리듬에 대한 조언"
    - "스트레스 관리가 필요한 국면"
    - "무리하기 쉬운 시기"
    - "회복에 시간을 두라는 조언"
    - "신체 부위·계통 언급 (§4.1 게이트 통과 시)"        # v0.18.0 추가
    - "증상 경향·체질 성향 서술 (§4.1 게이트 통과 시)"   # v0.18.0 추가

  prohibited:
    - "확정 병명 진단"
    - "중병·불치·사망 지시 (§5.1 S3 — 폐지되지 않음)"
    - "안심시키는 표현 — 예: 올해는 건강이 안정적"
    - "치료·투약·시술에 대한 지시나 권유"

  under_review:                            # ISSUE-026 — 미결
    - "신체 부위 + 특정 시기 결합 (예: 2028년 소화기 주의)"

  mandatory_disclaimer_scope: all_condition_statements
  mandatory_disclaimer_note: >
    신체 서술을 허용하는 이상 고지문이 형식이 아니라 필수 요소가 된다.
    컨디션 항목이 리포트에 포함되면 예외 없이 첨부한다.

  rationale_reverse_risk: >
    경고보다 안심이 더 위험하다. 실제 증상이 있는 사람이 "안정적" 이라는 서술을 읽고
    의료기관 방문을 미룰 수 있으며, 이는 리포트가 직접 만든 해악이다.

  mandatory_disclaimer: >
    이 항목은 의학적 판단이 아니며 진단·치료를 대체하지 않습니다.
    신체적·정신적 증상이 있다면 의료기관에 문의하시기 바랍니다.

  active_referral: >
    불면·불안·감정 기복·일상 기능 저하가 지속된다면 이 해석으로 해결하려 하지 마시고
    의료·상담 전문가의 도움을 받으시기 바랍니다.
  active_referral_note: >
    수동적 고지문과 별개로 능동적 안내를 둔다. 고지문은 책임 범위를 밝히는 것이고,
    이 문장은 고객이 실제로 도움을 받도록 유도하는 것이다. 둘 다 필수.

  legal_note: >
    면허 없는 의료행위 및 표시광고법상 효과 보장 광고 문제는 변호사 확인 사항.
    본 항목은 법률 자문이 아니다.

  crisis_signal: >
    §5.3 — 고객 입력에 자해·자살 관련 표현이 감지되면 리포트 작성을 중단하고
    지원 안내로 전환한다. 이 규칙은 컨디션 카테고리 유무와 무관하게 항상 적용된다.

# =============================================================================
# 10. 안전 게이트 (§5, 19 헤더, 43 §0, 41_1_ §3.4 · §3.12)
# =============================================================================
safety:
  s3_topics: [death, lifespan, terminal_illness, infertility, divorce, bereavement]
  s3_intake_conflict:                  # 고객 상태가 S3 영역인 경우
    detection: "상세 리포트 접수 시 relationship_status 또는 focus 에서 감지"
    cases:
      - status: "이혼·별거 진행 중"
        rule: >
          §5.1 상 이혼은 절대 금지 주제이므로 해당 상황에 대한 판정을 제공할 수 없다.
          접수 시점에 이 사실을 고지하고, 관계 카테고리를 제외하거나
          "관계에서의 자기 패턴" 처럼 상태와 무관한 항목만 다룬다.
        prohibited: "이혼 절차의 시기·결과·유불리 판정"
      - status: "사별"
        rule: "관계 카테고리 접수를 권하지 않는다. 고객이 원하면 자기 패턴 항목만."
    note: >
      고객이 바로 그 주제 때문에 구매했을 수 있으므로, 접수 후 환불보다
      접수 전 고지가 낫다. 상품 설명에 다루지 않는 주제를 명시한다.
  s3_output: prohibited                  # §5.1 — 변환·암시로도 출력 금지
  substitution_table: 91_민감표현_치환표.md
  career_prohibited:                     # 19 헤더
    - "확정적 실패·강등·해고 예언"
    - "특정 직업 강요"
    - "당신은 절대 이 직업 못 함 류의 표현"
  career_allowed_frames:                 # 19 헤더 · §10
    - "커리어의 큰 도약이 가능한 시기"
    - "직업의 재정비가 유리한 국면"
    - "새로운 방향의 발견이 필요한 시기"
    - "특별한 노력이 결실 맺는 시기"
  no_single_batch_determination: false    # §5.4 폐지 (운영자 결정, v0.18.0)
  no_single_batch_determination_note: >
    §5.4(직업명·배우자 성격·질병을 하나의 배치로 확정하지 않는다)를 폐지한다.
    폐지 사유 — 국내 점술 관행에서 통용되는 서술 범위이며, 1차 생성 후
    운영자 검토 단계에서 정정한다는 운영 방침.
    실질 효과 — §4.1(근거 계열 3개 + L1)은 그대로 유지되므로 단일 배치 주장은
    여전히 게이트를 통과하지 못하고 statement_policy 에 따라 강등된다.
    §5.4 폐지는 "금지 해제" 이지 "게이트 면제" 가 아니다.
  treat_client_input_as_data: true        # §5.2 고객 입력 지시문 미실행
  crisis_signal_halt: true                # §5.3


# =============================================================================
# 3. 컴버스트 / 연소 (41_BPHS_바르가판독_1_.md §7 + 하단 교정 섹션)
# =============================================================================
# ⚠️ 이 블록은 원본 문서 내부에 표 충돌이 있다. ISSUE-004 · ISSUE-005 참조.
combustion:
  unit: degrees_from_sun
  applies_to_nodes: false               # 41 §7 — 라후·케투는 수학적 점

  moon:    { direct: 12.0, retrograde: null,  status: 확정 }
  mercury: { direct: 14.0, retrograde: 12.0,  status: 확정 }
  jupiter: { direct: 11.0, retrograde: 11.0,  status: 확정 }
  venus:   { direct: 10.0, retrograde: 8.0,   status: 확정 }

  saturn:
    direct: 16.0                        # 원전값 채택 (ISSUE-004 해결)
    retrograde: 16.0
    status: 확정
    source_printed: { direct: 16.0, retrograde: 16.0 }   # 원본 p.100 이미지 확인
    deprecated_value: 15.0              # 41_1_ v1.1 교정 섹션
    note: >
      원전 p.100 은 순행·역행 모두 16° 로 명확히 인쇄되어 있다.
      41_1_ v1.1 의 15° 는 전사 오류가 아니라 의도적 변경이었으나 근거가 기록되지 않았고
      작성자도 기억하지 못한다. §7 출처등급(원전 > 실전서)에 따라 원전값으로 복귀한다.
      15° 의 근거가 후에 확인되면 §1.6 에 따라 병기 검토.

  mars:
    direct: 17.0
    retrograde: 8.0                     # 원전 확인 완료
    status: 확정
    note: >
      원전 p.100 이 화성 역행 8° 를 명시(원본 이미지 확인).
      "금성 역행값 8° 의 행 복사 오류" 가설은 기각됨 — 두 값이 같은 것은 우연이다.
      41_1_ §7 본표의 "해당 없음" 표기가 오류이며 교정 섹션이 옳았다.


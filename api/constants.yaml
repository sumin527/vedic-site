# 9. 다샤 · 트랜짓 (02_이벤트타이밍_KN라오.md, 19_하우스10.md §6)
# =============================================================================
timing:
  dasha_system: vimshottari

  # --- 빔쇼타리 다샤 표 (42_BPHS_다샤상세_1_.md v1.1) ---
  vimshottari:
    total_years: 120                     # 체크섬 — 9개 합이 120 이어야 한다
    order: [ketu, venus, sun, moon, mars, rahu, jupiter, saturn, mercury]
    years:
      ketu: 7
      venus: 20
      sun: 6
      moon: 10
      mars: 7
      rahu: 18
      jupiter: 16
      saturn: 19
      mercury: 17
    source: "42_BPHS_다샤상세_1_.md v1.1"
    cycle_note: >
      낙샤트라 27 ÷ 로드 9 = 3. 각 로드가 낙샤트라 3개를 지배한다.
      케투부터 시작하는 순서는 아쉬위니(케투 지배)가 1번 낙샤트라인 것과 정합한다.

    # --- 날짜 환산 (91_계산엔진_작업지시서.md) ---
    year_definition: true_sidereal_solar_year
    year_definition_status: 확정
    year_definition_rule: >
      다샤 1년 = 태양이 sidereal 로 360° 를 도는 실제 시간이다. 고정 일수가 아니다.
      지구 궤도가 타원이므로 구간마다 길이가 다르다 (근일점 부근 빠름, 원일점 부근 느림).
      계산은 일수 곱셈이 아니라 "출발 시점에서 태양이 N × 360° 진행하는 시점" 을 푼다.
    year_definition_evidence: >
      JHora 화면 우측 상단 "Using true sidereal solar years" 표기.
      검증 — 첫 마하다샤 종료 오차가 365.25 고정 시 -4일, true sidereal 시 -8.5시간.
      케투 마하 내 안타르다샤 3개도 8~25분 오차로 일치(적분 정밀도 한계).
    days_per_year_mean: 365.256363       # 참고용 평균값. 계산에 사용 금지
    days_per_year_deprecated: 365.25     # 91_계산엔진_작업지시서.md 값 — 폐기
    traditional_year_days: 360           # 전통 Y/M/D 표기용. 날짜 계산에 사용 금지
    traditional_month_days: 30           # 전통 Y/M/D 표기용
    measurement_log:                     # JHora 마하다샤 전체 구간 실측 (1992-05-27 차트)
      - { span: "Sat→Merc", years: 17, days: 6209.356, per_year: 365.256242 }
      - { span: "Merc→Ket", years: 7,  days: 2556.799, per_year: 365.256991 }
      - { span: "Ket→Ven",  years: 20, days: 7305.122, per_year: 365.256091 }
      - { span: "Ven→Sun",  years: 6,  days: 2191.535, per_year: 365.255768 }
    measurement_note: >
      4개 구간이 365.2560~365.2570 에 수렴하나 이는 평균일 뿐이다.
      실제로는 구간마다 길이가 다르며 태양의 실제 sidereal 운동을 따른다.
      케투 마하가 11월에 시작해 태양이 빠른 구간을 지나므로 안타르다샤가
      선형 계산보다 일찍 끝나는 현상이 이를 직접 보여준다.

    conversion_warning: >
      360일년과 365.25일년을 섞으면 다샤 경계가 수개월 밀린다.
      실제 날짜는 365.25 로만 계산하고, 360/30 은 "3년 6개월 12일" 같은
      전통 표기를 만들 때만 쓴다. 두 체계를 한 계산 안에서 혼용하지 않는다.

    # --- 시작점 ---
    start_rule: >
      출생 시점 달의 낙샤트라 잔여 비율로 첫 마하다샤의 잔여 기간을 정한다.
      잔여 비율 = (낙샤트라 종료 경도 - 달 경도) / 낙샤트라 폭
      첫 마하다샤 잔여 = 해당 로드의 years × 잔여 비율
    start_rule_index_note: >
      낙샤트라 인덱스는 arithmetic.index_formula 의 정수 곱셈 공식을 쓴다.
      *_span_deg 로 나누지 않는다(절단 상수가 경계에서 오차를 만든다).

    do_not_mix:                          # §1.6 — 다샤 체계 혼용 금지
      - "Saravali 물라 다샤 (64_Saravali_다샤_교차검증.md) — 빔쇼타리와 혼합하지 않는다"
  resolution_layers: [mahadasha, antardasha, pratyantardasha]   # 02 §1
  layer_roles:
    mahadasha: "전반 트렌드 — 인생 국면"
    antardasha: "구체 트렌드 — 기간 주제"
    pratyantardasha: "이벤트 번역 — 월 단위 창"
  double_transit: [jupiter, saturn]      # 02 §2 실현의 관문
  transit_quality_gate: ashtakavarga     # 02 §2 확장 규칙
  do_not_mix_dasha_systems: true         # §1.6 — 물라 다샤와 빔쇼타리 혼용 금지
  gochara_model: jupiter_saturn_double_transit
  gochara_model_note: >
    Phaladeepika 계열 잔마라시 기준 고차라는 채택하지 않는다.
    K.N. Rao 계열 이중 트랜짓 + AV 검증 모델과 판본이 다르므로 §1.6 충돌을 만든다.


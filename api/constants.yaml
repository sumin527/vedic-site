    action: "19 §7.5 에 43 참조 주석 추가 (문서 수정, 값 변경 아님)."

  - id: ISSUE-002
    title: 아쉬타카바르가를 근거 계열로 세는 문제
    status: 해결
    blocking: false
    resolved_note: >
      t5_ashtaka.counts_as_evidence: false 로 확정. AV 는 intensity_modifier 로만 사용.
      결정 비용 0 — statement_policy 가 이미 등급 판정에 count_b(AV 제외)를 쓰고 있어,
      공식 제외 후에도 파일럿 4건의 등급이 전부 동일함을 검증했다.
      근거 수렴 3건: 43 §5.1, 명리 실무의 신살 보조 지표 처리, 최초 설계 권고.
    detail: >
      43 §5.1 은 AV 가 사건의 종류를 결정하지 않는다고 명시.
      그러나 §9.1 은 AV 를 독립 계열 ⑤ 로 센다. 사건 종류를 결정하지 않는 지표는
      결론의 근거가 될 수 없으므로 §4.1 의 3계열을 공짜로 채우는 구멍이 된다.
    convergence_evidence: >
      독립 수렴 3건 — (1) 43 §5.1 "AV 는 사건의 종류를 결정하지 않는다",
      (2) 전통 명리 실무의 신살 처리("보조 지표, 격국·용신보다 우선하지 않음"),
      (3) 본 프로젝트의 최초 설계 권고. 서로 다른 전통이 같은 설계 문제에
      같은 해법(보조 지표 강등)을 냈다는 점은 방향에 대한 방증이다.
      단 파일럿 데이터(제거 시 0/3)에 따라 실행은 공백 보강 이후로 미룬다.
    recommendation: >
      [파일럿 1회차 결과로 권고 수정 — 결정 보류]
      av_dependent 2/3 (67%). 게이트 설계 기준상 "절반 이상"이므로 AV 제거가 아니라
      공백 계열 보강이 답이다. 측정 결과 AV 는 T2(카라카)·T4(다샤)의 빈자리를
      메우고 있었을 뿐이며, AV 자체가 근거로 정당한지는 아직 판별되지 않았다.
      ISSUE-013·014·006 해소 후 재측정한다.
    pilot_log:
      - round: 1
        date: "2026-07"
        chart: "파일럿 본인 차트 (1992)"
        category: career
        conclusions: 3
        levels: { verdict: 0, divergent: 0, conditional: 0, withheld: 3 }
        av_dependent: 2
        empty_tiers: "T2 3/3, T4 2/3, T3 2/3"
        note: "divergent 등급 도입 전. 이후 재판정 시 양면 2 · 조건부 1"
      - round: 2
        date: "2026-08"
        chart: "파일럿 본인 차트 (1992)"
        category: career
        conclusions: 3
        levels: { verdict: 0, divergent: 2, conditional: 1, withheld: 0 }
        av_dependent: 2
        empty_tiers: "T2 3/3, T4 3/3"
      - round: 3
        date: "2026-08"
        chart: "검증 차트 (1987)"
        category: career
        conclusions: 1
        levels: { verdict: 1, divergent: 0, conditional: 0, withheld: 0 }
        av_dependent: 0
        note: "T2·T4 모두 채워짐. 파일럿의 양면은 T3 처리 문제가 아니라 그 차트의 특성"
      - round: 4
        date: "2026-08"
        chart: "검증 차트 (1987)"
        category: finance
        conclusions: 3
        levels: { verdict: 2, divergent: 1, conditional: 0, withheld: 0 }
        av_dependent: 0
        note: >
          금전이 커리어보다 근거가 두껍다는 evidence_map_finance 예측이 확인됐다.
          T2(목성 자연 카라카)·T4(11 §5 + 20 §7.2)가 규칙 부재 없이 채워졌다.

    av_dependent_cumulative: "4/10 결론 (커리어 4/4, 금전 0/3, 검증차트 커리어 0/1)"
    av_conclusion: >
      카테고리별로 갈린다. 커리어는 T2(AmK 공백)·T4(노드) 때문에 AV 의존이 높고,
      금전은 자연 카라카와 두꺼운 다샤 표 덕에 의존이 없다.
      AV 를 계열에서 제외한 결정(ISSUE-002)은 금전에서는 무해하고
      커리어에서는 규칙 공백을 드러내는 역할을 한다.
    side_effect: "3계열 충족이 어려워져 리포트 탈락 결론이 증가 → 분량 변동성 확대."

  - id: ISSUE-003
    title: 19 §6.4 "확정 신호" 의 트랜짓 계열 부풀리기
    status: 해결
    blocking: false
    resolved_note: >
      transit_aggregation: sum_as_one 확정. 19 §6.4 의 4조건은 계열 판정에 사용하지 않고
      T4 내부의 강도·서술 순서 결정에만 쓴다. "확정" 표현은 §6.3 과 충돌하므로
      statement_policy 등급으로 대체하며, 등급명은 서술층에 넘기지 않는다.
    detail: >
      19 §6.4 는 4조건 중 3개 충족을 "확정 신호"로 규정. 그러나 4조건 중
      ①다샤 ②목성 트랜짓 ④카라카 트랜짓은 §9.1 기준 동일 계열(④)이고
      ③AV 는 ISSUE-002 에 따라 계열이 아니다. 실질 1계열을 3조건으로 세고 있다.
      또한 "확정" 이라는 표현이 §6.3 과 충돌한다.
    recommendation: >
      transit_aggregation: sum_as_one 확정. 내부 표기는 confidence: high 로 하고
      고객 문장에는 확정 표현을 쓰지 않는다.


  - id: ISSUE-019
    title: 판정 기준점 — 라그나 vs 달 중 강한 쪽 (미정)
    status: 해결
    blocking: false
    resolved_note: >
      C안 채택 — 라그나 주 기준, 찬드라 라그나 보조. 리포트에 양쪽 다 서술하되
      계열은 하나로 센다(reference_point_aggregation: sum_as_one).
      62 §0 의 "더 강한 쪽" 방식은 강약 판정 규칙이 지식베이스에 없어 미채택(§6.1).
      불일치 시 §4.3 병기 + time_precision_flag.
    severity: critical
    detail: >
      62 §0 은 Saravali Ch.33 을 근거로 "라그나와 달 중 더 강한 기준점에서 10번째"를
      먼저 판단하라고 규정한다. 그러나 현재 파이프라인은 라그나 기준 홀사인만 사용하며,
      "어느 쪽이 더 강한가"를 판정하는 규칙이 지식베이스 어디에도 없다.
    impact: >
      파일럿 차트에서 라그나 기준 10H = 염소(토성 자기사인, 사사 요가),
      달 기준 10H = 사수(라후). 판정이 통째로 달라진다.
      파일럿 C1·C3 의 T1·T6 근거 전체가 라그나 기준을 전제로 성립하므로,
      달이 강한 기준점이면 두 결론은 재작성 대상이다.
    action: >
      (a) 라그나 고정으로 정책 확정하고 62 §0 을 병기 처리하거나
      (b) 강약 판정 규칙을 원전에서 확보하고 이중 판정을 도입한다.
      63_Saravali_행성강도_광선.md (Rasmi) 에 강도 산출 근거가 있는지 먼저 확인할 것.
    variants_found:                      # 문서마다 달 기준 사용법이 다르다
      - doc: 62_Saravali_직업판단.md §0
        rule: "라그나와 달 중 더 강한 쪽을 기준점으로 대체"
      - doc: 11_하우스2.md §5
        rule: "달 기준 2로드를 영향 행성에 추가 (대체가 아니라 병행)"
      - doc: 현재 파이프라인
        rule: "라그나 단독"
    variants_note: >
      세 방식이 서로 다르다. 대체(62) / 추가(11) / 단독(엔진).
      단일 정책으로 통일하거나 카테고리별로 다르게 적용할지 결정해야 한다.

  - id: ISSUE-020
    title: 62 §6 직업 점수 엔진이 §9.1 계열 집계와 충돌
    status: 해결
    blocking: false
    resolved_note: >
      §9.1 이 상위 정책. 62 §6 점수제는 계열 집계에 사용하지 않고
      직무 기능의 내부 서술 순서를 정하는 데만 쓴다.
      점수는 output_contract.narration.internal_only_fields 에 포함되어
      서술층에 전달되지 않으므로 리포트에 노출되지 않는다.
    detail: >
      62 §6 은 가중 합산 점수제(14점 이상 = 핵심 커리어 축)를 별도로 정의한다.
      이를 §9.1 계열로 환산하면 10H재실 3 + 10L 3 은 둘 다 T1,
      AmK 2 + AK-AmK 2 는 둘 다 T2, 다샤 3 + 목·토 트랜짓 2 는 둘 다 T4 이다.
      T1·T2·T4 세 계열만으로 15점이 나와 최고 등급 판정을 받을 수 있다.
      §9.1 이 바르가에서 막고 ISSUE-003 이 트랜짓에서 지적한 계열 부풀리기와 동형이다.
    action: >
      §9.1 을 상위 정책으로 확정하고 62 §6 점수제는 리포트 판정에 사용하지 않거나,
      점수제를 계열 단위로 재설계한다. 두 체계를 동시에 운용하지 않는다.

  - id: ISSUE-021
    title: §9.1 계열 집계에 출처등급 가중치가 없음
    status: 결정대기
    blocking: false
    detail: >
      §7 은 "등급이 다른 자료의 규칙은 같은 무게로 섞지 않는다"고 규정하나,
      §9.1 계열 집계와 §4.1 의 3계열 요건에는 등급 개념이 없다.
      원전 직접 요약 규칙과 [실전 운영] 파생 규칙이 동일하게 1계열로 계산된다.
      ISSUE-014 의 AmK 파생 문서를 만들면 이 문제가 즉시 현실화된다.
    action: >
      §9.2 우선순위(구체적 조건 → 강한 행성 → 바르가 반복 → 다샤 활성)에
      출처등급 항목을 넣을지, 또는 파생 규칙 단독으로는 계열을 채우지 못하게 할지 결정.

  - id: ISSUE-022
    title: 종합형 카테고리 3종의 근거 소재지 표 미작성
    status: 해결
    blocking: false
    resolved_note: >

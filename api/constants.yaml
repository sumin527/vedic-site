# =============================================================================
# constants.yaml — 베딕 판정 엔진 상수 레지스트리
# =============================================================================
# 성격: 판정층 코드가 참조하는 유일한 수치 출처(single source of truth).
#       코드는 지식베이스 .md 문서에서 숫자를 읽지 않는다. 이 파일만 읽는다.
#
# 원칙:
#   - 04_프로젝트_기본지침_v2.0.md §1.6 — 판본이 다르면 병기한다.
#     → 각 항목에 source_value(원전·문서 인쇄값)와 engine_value(엔진 채택값)를 병기.
#   - §2.1 — 원본 문서는 수정하지 않는다.
#     → 이 파일은 문서를 고치지 않고 값만 추출·정규화한다.
#   - §6.2 — 존재하지 않는 값을 만들지 않는다.
#     → 미확인 값은 null + status: 확인대기. 임의로 채우지 않는다.
#
# 범위: 커리어 타이밍 리포트 v1 경로에 필요한 상수만.
#       쇼다나·핀다·특별라그나·굴리카·프라나파다는 v1 경로 외 → 미포함.
#
# 구간 표기 규약 (전 파일 공통):
#   min 이상, max 미만  (max_inclusive: true 인 최상위 구간만 예외)
#   → 소수 경계에서 등급이 두 개가 되는 문제를 차단한다.
# =============================================================================

meta:
  version: 0.46.0   # 2026-09-29: de405→de430 (행성중심 세그먼트, 1550-2650, 장동 제거=평균황도)
  scope: career_timing_report_v1
  created_from:
    - 19_하우스10.md
    - 43_BPHS_아쉬타카바르가.md
    - 44_BPHS_카라카_특수점.md
    - 40_BPHS_바르가계산_1_.md
    - 41_BPHS_바르가판독_1_.md
    - 02_이벤트타이밍_KN라오.md
  archive_excluded:                     # §1.7 — 근거로 사용 금지
    - 40_BPHS_바르가계산.md
    - 41_BPHS_바르가판독.md
  blocking_issues: 0                     # 발행 차단 없음                    # open_issues 의 blocking: true 개수
  release_gate: >
    open_issues 에 status: 결정대기 또는 확인대기 항목이 남아 있으면
    유료 리포트를 발행하지 않는다.

# =============================================================================
# 1. 근거 계열 정책 (§4.1 · §9.1)
# =============================================================================
evidence_policy:
  min_tiers: 3                          # §4.1 핵심 결론당 최소 근거 계열 수
  l1_required: true                     # D1 직접 지시(하우스/로드/카라카) 필수
  l1_definition: [d1_house, d1_lord, d1_occupant]

  tiers:                                # §9.1 계열 구분
    t1_d1:        { name: "D1 하우스/로드/재실", counts_as_evidence: true }
    t2_karaka:    { name: "카라카",              counts_as_evidence: true }
    t3_varga:     { name: "바르가(D9·D10 합산 1계열)", counts_as_evidence: true }
    t4_dasha:     { name: "다샤/트랜짓",          counts_as_evidence: true }
    t5_ashtaka:   { name: "아쉬타카바르가",       counts_as_evidence: false }  # ISSUE-002 해결
    t6_yoga:      { name: "요가",                counts_as_evidence: true }

  varga_aggregation: sum_as_one          # §9.1 바르가 개수로 계열 수를 늘리지 않는다
  transit_aggregation: sum_as_one        # ISSUE-003 해결 — 확정
  reference_point_aggregation: sum_as_one # ISSUE-019 해결 — 라그나·달 기준은 합산 1계열
  cross_tradition_excluded: true         # §1.1 서양고전 규칙은 계열에 넣지 않는다

  # --- 판정 기준점 정책 (ISSUE-019) ---
  reference_points:
    primary: lagna                        # 결론의 내용을 결정
    secondary: chandra_lagna              # 같은 계열 안에서 보강 또는 이견
    both_written: true                    # 리포트에 양쪽 다 서술한다
    tier_counting: single                 # 서술은 둘, 계열은 하나

    semantics:
      lagna: "몸·외부 환경·실제 사건 — 무슨 일이 일어나는가"
      chandra_lagna: "마음·감정·체감 — 그 일을 어떻게 느끼는가"

    on_agreement: >
      두 기준이 같은 방향이면 해당 계열의 강도가 올라간다. 계열 수는 변하지 않는다.
    on_disagreement: >
      §4.3 에 따라 양쪽을 병기하고 time_precision_flag 를 세운다.
      라그나는 2시간, 달은 2.25일 주기이므로 불일치는 출생시각 정밀도가
      결과를 좌우하는 차트라는 신호이기도 하다.

    source_variants:                      # §1.6 병기
      - doc: "62_Saravali_직업판단.md §0"
        rule: "라그나와 달 중 더 강한 쪽으로 대체"
        adopted: false
        reason: "강약 판정 규칙이 지식베이스에 없다. 새로 만들면 §6.1 위반."
      - doc: "11_하우스2.md §5"
        rule: "달 기준 2로드를 영향 행성에 추가 (병행)"
        adopted: true


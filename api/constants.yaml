  - id: ISSUE-026
    title: 신체 부위 + 특정 시기 결합 서술의 허용 여부
    status: 결정대기
    blocking: false
    detail: >
      §5.4 폐지로 신체 서술 일반은 허용되었으나, "신체 부위 + 특정 시기" 결합은
      성격이 다르다. 예 — "소화기가 예민한 편" vs "2028년 소화기 문제에 주의".
      후자는 장기 불안 구간을 형성하고, 실제 증상이 다른 부위에 있는 고객이
      리포트와 대조하다 의료기관 방문을 늦출 위험(역방향 위험)이 있다.
      문장 자체가 완곡하므로 운영자 검토 단계에서 검출이 어렵다.
    action: >
      파일럿에서 실제 생성 문장을 확인한 뒤 결정한다.
      허용 시 condition_category_policy.under_review 에서 allowed 로 이동,
      금지 시 prohibited 로 이동.

  - id: ISSUE-027
    title: 제3자 판정 — 배우자·파트너 서술의 범위
    status: 결정대기
    blocking: false
    detail: >
      배우자·파트너는 고객이 아니다. 분석에 동의한 적이 없고 본인 차트도 없다.
      16 §8.5 는 배우자 건강에 대해 "그 사람의 차트로 판단해야 하며 상담자 차트로
      배우자의 위기를 예언하는 것은 윤리적·법적·심리적으로 위험" 하다고 명시한다.
      20 §9.4 도 손윗형제에 대해 동일 원칙을 적용한다.
      §5.4 폐지는 고객 본인에 대한 서술 제한을 푼 것이지 제3자 판정을 승인한 것이 아니다.
    current_rule: >
      evidence_map_relationship.md §2-2 — 서술 주어를 사람이 아니라 관계로 둔다.
      "배우자는 지배적입니다" 가 아니라 "관계에서 주도권이 두드러지는 구조입니다".
    action: >
      배우자 외모·직업·방위 등 심화 서술(16 §5.5, §8.4)의 허용 범위를 확정할 것.
      추가금 상품에 포함할지 여부와 함께 결정.

  - id: ISSUE-028
    title: 궁합(Ashtakuta) — 상대방 출생정보 접수 정책 필요
    status: 확인대기
    blocking: false
    detail: >
      16 §6 궁합은 두 차트가 필요하다. 현재 intake_policy 는 고객 1인 기준이며
      제3자 출생정보 수집·보관·파기 절차가 정의되어 있지 않다.
      상대방의 출생정보는 상대방의 개인정보이므로 수집 근거가 별도로 필요하다.
    opportunity: >
      명백히 "다른 종류의 작업"(별도 입력 + 별도 계산)이므로 추가금 상품으로 최적이다.
      기본 리포트는 궁합 없이 완결되므로 tiering.addon_principle 에 부합한다.
    action: >
      상대방 동의 확보 방식, 보관·파기 정책을 intake_policy 에 추가한 뒤 상품화.
      법률 자문 확인 항목.

  - id: ISSUE-029
    title: 다샤 연 길이 — 365.25 vs 항성년 365.2564
    status: 해결
    blocking: false
    resolved_note: >
      둘 다 아니다. JHora 는 true sidereal solar year — 태양이 sidereal 360° 를
      도는 실제 시간을 쓴다. 고정 일수가 아니므로 365.25 도 365.2564 도 근사값이다.
      91_계산엔진_작업지시서.md 의 365.25 는 개정 대상.
    detail: >
      91_계산엔진_작업지시서.md 는 365.25(율리우스년)를 지정하나,
      JHora 마하다샤 전체 구간 4개를 실측한 결과 모두 365.2560~365.2570 으로
      항성년(365.256363)에 수렴했다. measurement_log 참조.
      차이는 연 0.006363일 — 19년 구간에서 0.12일, 120년 전체에서 0.76일.
    impact: 작음
    action: >
      항성년 채택 시 91_계산엔진_작업지시서.md 개정 필요(§1.6 병기 또는 교정).
      단독으로는 영향이 작으므로 ISSUE-030 과 함께 결정할 것.

  - id: ISSUE-031
    title: 다샤 구현 방식 변경 — 일수 곱셈에서 태양 경도 해로
    status: 해결
    blocking: false
    resolved_note: >
      true sidereal solar progress solver 구현 완료. JHora 12개 경계 전부 1시간 이내 일치.
      잔차는 +28.8 ~ +30.3분으로 일정하며 전량 설명된다 —
      아야남샤 미세차 0.140각초 → 낙샤트라 잔여율 차 2.925e-06
      → 토성 19년 구간에서 +29.2분. 실측과 정확히 일치한다.
      첫 마하다샤 시작점이 29분 이동하고 이후 전 타임라인이 통째로 따라 이동하므로
      12개 경계의 잔차가 모두 같다. 구현 오류가 아니다.
    detail: >
      engine/dasha.py 가 days_per_year 곱셈으로 구현되어 있으나
      ISSUE-029 결과 true sidereal solar year 로 바뀌어야 한다.
      필요한 함수 — 기준 시점 jd0 과 진행 각도 deg 를 받아
      "태양이 sidereal 로 deg 만큼 진행한 시점" 을 반환하는 solver.
      다샤 경계는 이 solver 로만 산출한다.
    verification: >
      본인 차트 기준 목표값 (JHora):
        첫 마하다샤(토성) 종료  2007-11-05 05:54:54
        케투 마하다샤          2024-11-04 14:27:42 ~ 2031-11-05 09:38:10
        케투 내 안타르 3건     Ket 2025-03-30 03:05:43 /
                              Ven 2026-05-31 02:19:34 / Sun 2026-10-08 23:14:17
      허용 오차 — 우선 1시간, 달성되면 10분으로 강화.
    note: >
      전통 Y/M/D 표기(360일년·30일월)는 표시 전용이며 이 변경과 무관하다.

  - id: ISSUE-032
    title: D16 시작 사인을 상대 offset 으로 잘못 기록
    status: 해결
    blocking: false
    detail: >
      v0.27.0 에서 D16 을 start_rule {movable:0, fixed:4, dual:8} 로 기록했으나,
      원전은 활동궁이면 양자리, 고정궁이면 사자자리, 이중궁이면 사수자리에서
      세라고 명시한다 — 시작 사인이 고정되어 있으므로 자기 사인 기준 offset 이 아니다.
      예 — 황소자리(고정궁)의 첫 쇼다삼샤는 사자자리이지 황소에서 5번째가 아니다.
      D9·D10 은 상대, D16 은 절대다.
    resolved_note: >
      start_mode: absolute 도입하고 start_rule 을 절대 사인 번호로 교정.
      검출 경위 — 검산 예시가 활동궁 하나뿐이라 다른 분기가 실행되지 않았고,
      변이 테스트에서 fixed offset 을 오염시켜도 검증기가 통과했다.
      이후 verified_examples 를 리스트로 바꾸고 모든 분기를 덮도록 강제했다.
    lesson: >
      검산 예시 1건은 규칙의 한 분기만 검증한다. 분기가 있는 규칙은
      모든 분기에 예시를 두고, 검증기가 커버리지 자체를 확인해야 한다.

  - id: ISSUE-030
    title: 첫 마하다샤 잔여 — JHora 대비 약 2.85일 차이
    status: 해결
    blocking: false
    severity: high
    resolved_note: >
      원인은 낙샤트라 잔여율이 아니라 연 길이 정의였다(ISSUE-029).
      우리 잔여율 81.2295% 는 정확하다 — 달 경도가 JHora 표시값과 0.14각초 일치.
      true sidereal solar year 를 적용하면 오차가 -4일에서 -8.5시간으로 감소한다.
      잔여 8.5시간은 검증 스크립트의 수렴 정밀도 수준으로 추정되며,
      구현 후 재측정한다.
    detail: >
      낙샤트라 잔여율이 어긋난다.
        우리 계산  : 81.2295%  (달 335.836061°, JHora 표시값과 0.14각초 일치)
        JHora 함의 : 81.2706%  (달 환산 335.830587°)
        차이       : 0.0411% = 달 경도 19.7각초 = 시간으로 약 36초
      15.4년 구간에서 2.85일 차이가 발생한다.
    ruled_out:
      - "연 길이 — 항성년을 써도 2.85일 잔존(ISSUE-029 는 별개, 0.12일 규모)"
      - "토포센트릭 달 — 적용 시 오차가 2.84%로 오히려 확대"
      - "달 경도 자체 — JHora 화면 표시값과 0.14각초 일치, 정상"
    remaining_candidates:
      - "JHora 다샤 모듈이 화면 표시와 다른 아야남샤 변종을 사용"
      - "시간 척도 차이 (UT vs TT, 1992년 ΔT 약 58초)"
    cross_check: >
      안타르다샤 분할은 정확하다 — 케투 마하 내 태양 안타르 종료일이
      JHora 와 0일 차이로 일치. 즉 비례 분할 로직은 옳고,
      오차는 첫 마하다샤의 시작 잔여율에 집중되어 있다.
    action: >
      JHora 에서 Vimsottari Dasa 화면의 "잔여" 표시값(년/월/일)을 직접 확인하고
      우리 계산값과 대조. 화면 표시가 있으면 원인 특정이 빨라진다.
    title: 에페메리스 파일 해시 미기록
    status: 해결
    blocking: false
    resolved_note: >
      sha256 2건 기록 완료. files_pinned_ref 커밋 고정 완료.
      해시 불일치 시 설치 실패하도록 setup_ephemeris.py 에 반영됨.
    detail: >
      arithmetic.ephemeris.files.*.sha256 이 null.
      raw.githubusercontent 의 master 브랜치 URL 은 파일이 교체될 수 있어,
      해시를 고정하지 않으면 과거 리포트를 재현할 수 없다.
      reproducibility_note 가 막으려던 상황과 동일.
    action: >
      설치 스크립트 실행 후 두 파일의 sha256 을 이 파일에 기록.
      가능하면 files_pinned_ref 에 커밋 SHA 도 고정한다(해시는 변경을 검출할 뿐,
      커밋 고정은 변경 자체를 막는다).

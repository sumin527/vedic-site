  - id: ISSUE-013
    title: 라후·케투(노드) 판독 규칙 공백
    status: 해결
    blocking: false
    progress: >
      47_노드다샤_판독규칙.md 신설 (BPHS-San Vol.2 Ch.55 라후 · Ch.59 케투, 출처등급 원전).
      라후·케투 마하다샤 18개 안타르다샤 전체 수록. 조건 57개.
      노드 25년 = 100% 커버. 어느 노드 다샤 조합이 와도 판정 가능하다.
    structural_finding: >
      19 §6.2 표가 로드십 기반이라 노드가 원리적으로 등장할 수 없었다.
      원전은 로드십 대신 배치 조건부로 다룬다 — 같은 안타르다샤라도 조건에 따라
      결과가 갈리며, 라그나 기준과 다샤 로드 기준 두 축을 함께 쓴다.
    remaining: >
      프라티안타르다샤(Ch.61 계열)만 미수록. 다만 19 §6.2 기존 표도 프라티안타르를
      다루지 않으므로 노드 고유의 공백이 아니다.
    rahu_specific_finding: >
      라후 장은 케투 장과 달리 특정 사인을 명시한다 —
      게·전갈·처녀·사수가 라후에게 유리한 사인. 로드십도 존엄도 아닌 라후 전용 규정.
    translator_note_found: >
      Ch.55 에 Santhanam 의 역자주 2건 — 슬로카 13-14½(목성)과 25-26(토성).
      둘 다 흉한 배치에 길한 결과가 함께 기술된 것을 지적하며
      "원문에 오류가 있을 수 있다" 고 명시. 해당 길한 결과는 미채택.
    next_priority: "케투 MD 나머지 6 AD (5.07년) — 완료 시 노드 커버리지 100%"
    downgrade_note: >
      statement_policy 도입으로 발행 차단 요인에서 제외. 노드 마하다샤 고객의
      타이밍 항목은 conditional 또는 withheld 로 강등되고 사유가 공개된다.
      다만 품질 목표로는 유효하다 — 고객 약 21% 가 영향받으므로 v2 우선 과제.
    detail: >
      파일럿 1회차에서 T4(다샤) 2/3, T3(바르가) 일부가 노드 규칙 부재로 비었다.
      구체적 공백: 케투 D10 하우스 판독, 케투 Vimsopaka, 케투 마하 - 행성 안타르 조합.
      19 §6.2 다샤 조합 11행표에 노드 마하 조합이 없다.
      지식베이스가 이미 자체 기록한 공백이다 — 57/58 Saravali 커버리지 문서,
      02_KN라오 "본문 미포함 주제" 목록에 라후·케투 결과 규칙이 명시되어 있다.
    impact: >
      빔쇼타리 120년 중 라후 18 + 케투 7 = 25년(약 21%). 고객 5명 중 1명이
      노드 마하다샤에 해당한다. 커리어 타이밍 리포트의 핵심 계열이 비는 것이라
      상품 성립에 직결된다.
    action: >
      노드 다샤 조합 규칙을 별도 문서로 신설. 원전 커버리지가 얕으므로
      §7 출처등급과 §6.3 불확실 표기를 함께 설계할 것.

  - id: ISSUE-014
    title: 아마티야카라카(AmK) 배치 판독 규칙 공백
    status: 확인대기
    blocking: false
    downgrade_note: >
      statement_policy 도입으로 발행 차단 요인에서 제외. T2 가 비면 계열 수가 줄어
      해당 결론이 conditional 로 강등된다. 품질 목표로는 유효.
    detail: >
      파일럿 1회차에서 T2(카라카) 계열이 3/3 전부 비었다. 44 §4.1 정독 결과 공백 위치 특정:
        있음 — AmK 정의(실행 방식), 판정 순서, AK-AmK 관계 규칙
        없음 — AmK 행성별 실행 스타일 표, AmK 하우스별 판독 규칙
      AK-AmK 관계 규칙도 결합/켄드라·트리코나 와 6/8·2/12 두 경우만 다루며,
      파일럿 차트의 실제 배치(AK 토성 10H ↔ AmK 화성 12H = 3/11)는 어느 쪽에도 없다.
    material_available:
      - "62 §1 행성별 직무 기능 7행 — 10H 재실용이나 행성→일 매핑으로 전용 가능"
      - "44 §3.2 AK 행성별 핵심 과제 8행 — 서술 톤 템플릿"
      - "44 §4.1 AmK = 실행 스타일 정의"
    proposed_approach: >
      위 재료로 "AmK 행성별 실행 스타일" 표를 §2.3 [실전 운영] 태그로 신설 가능.
      단 AmK 하우스별 판독은 재료가 없어 신설 불가 — 만들면 §6.1 위반이다.
    caveat: >
      [실전 운영] 규칙은 §7 출처등급상 원전보다 하위이나 §9.1 계열 집계에는
      등급 가중치가 없다. 파생 규칙 하나가 원전 규칙과 동일한 무게로 T2 를 채우게 된다.
      ISSUE-021 과 함께 결정할 것.
    impact: >
      T2 는 §4.1 의 L1 후보이자 커리어 판정의 핵심 계열이다.
      이것이 비면 남은 계열로 3개를 채우기 위해 AV 의존이 발생한다(ISSUE-002 참조).
    action: "AmK 행성별 x 하우스별 판독 규칙 신설. 카라캄샤(44 §6.3)와의 관계도 정리."


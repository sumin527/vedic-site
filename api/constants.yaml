# =============================================================================
# 5. 바르가 분할 (40_BPHS_바르가계산_1_.md)
# =============================================================================
varga:
  # 모든 분할 규칙 출처: BPHS-San Vol.1 Ch.6 (원본 이미지 확인)
  # start_offset = 시작 사인까지의 사인 수 (0 = 자기 사인)
  # 공통 산식: result = ((sign - 1 + start_offset + (division_index - 1) * step) % 12) + 1
  #            division_index = floor(deg_in_sign / size_deg) + 1,  step 기본값 1
  # start_mode: relative = 자기 사인 기준 offset / absolute = 고정된 시작 사인
  #   relative → base = sign - 1 + offset      (D3 D4 D7 D9 D10 D12)
  #   absolute → base = start_sign - 1         (D16)
  # verified_examples 는 start_rule 의 모든 분기를 빠짐없이 덮어야 한다(검증기가 강제).

  d1:
    divisions: 1
    size_deg: 30.0
    start_mode: relative
    start_rule: { all: 0 }
    verified_examples:
      - { input: { sign: 6, deg: 14.3333 }, expect_division_index: 1, expect_result_sign: 6, branch: all }

  d2:                                    # Hora — 책 p.69
    divisions: 2
    size_deg: 15.0
    special: true
    lord_rule:
      odd_sign:  [sun, moon]             # 0~15° 태양 / 15~30° 달
      even_sign: [moon, sun]
    sign_map: { sun: 5, moon: 4 }        # 태양의 호라 = 사자 / 달의 호라 = 게
    note: >
      D2 는 사인이 아니라 태양·달 지배를 산출한다. 사인 표기가 필요하면 sign_map 을 쓴다.
      공통 산식을 적용하지 않는다.
    verified_examples:
      - { input: { sign: 1, deg: 10.0 },  expect_lord: sun,  branch: odd_sign }
      - { input: { sign: 1, deg: 20.0 },  expect_lord: moon, branch: odd_sign }
      - { input: { sign: 2, deg: 10.0 },  expect_lord: moon, branch: even_sign }
      - { input: { sign: 2, deg: 20.0 },  expect_lord: sun,  branch: even_sign }

  d3:                                    # Drekkana — 슬로카 7-8, 책 p.69
    divisions: 3
    size_deg: 10.0
    start_mode: relative
    start_rule: { all: 0 }
    step: 4                              # 자기 사인의 1·5·9번째
    verified_examples:
      - { input: { sign: 1, deg: 15.0 }, expect_division_index: 2, expect_result_sign: 5,  branch: all }
      - { input: { sign: 4, deg: 25.0 }, expect_division_index: 3, expect_result_sign: 12, branch: all }

  d4:                                    # Chaturthamsa — 책 p.71
    divisions: 4
    size_deg: 7.5
    start_mode: relative
    start_rule: { all: 0 }
    step: 3                              # 1·4·7·10번째
    verified_examples:
      - { input: { sign: 1, deg: 10.0 }, expect_division_index: 2, expect_result_sign: 4,  branch: all }
      - { input: { sign: 3, deg: 25.0 }, expect_division_index: 4, expect_result_sign: 12, branch: all }

  d7:                                    # Saptamamsa — 슬로카 10-11, 책 p.71
    divisions: 7
    size_deg: 4.2857143                  # 30/7 = 4°17′8.57″
    start_mode: relative
    start_rule: { odd: 0, even: 6 }      # 홀수=자기 사인 / 짝수=7번째부터
    verified_examples:
      - { input: { sign: 1, deg: 1.0 }, expect_division_index: 1, expect_result_sign: 1, branch: odd }
      - { input: { sign: 2, deg: 5.0 }, expect_division_index: 2, expect_result_sign: 9, branch: even }

  d9:                                    # Navamsa — 슬로카 12, 책 p.72
    divisions: 9
    size_deg: 3.3333333                  # 3°20′ — 파다와 동일
    start_mode: relative
    start_rule: { movable: 0, fixed: 8, dual: 4 }   # 자기 / 9번째 / 5번째
    note: "황소(고정궁)의 첫 나밤샤는 염소자리 — 원전 표 2열 1행과 일치."
    verified_examples:
      - { input: { sign: 1, deg: 1.0 }, expect_division_index: 1, expect_result_sign: 1,  branch: movable }
      - { input: { sign: 2, deg: 1.0 }, expect_division_index: 1, expect_result_sign: 10, branch: fixed }
      - { input: { sign: 3, deg: 1.0 }, expect_division_index: 1, expect_result_sign: 7,  branch: dual }

  d10:                                   # Dasamsa — 슬로카 13-14, 책 p.73
    divisions: 10
    size_deg: 3.0
    start_mode: relative
    start_rule: { odd: 0, even: 8 }      # 홀수=자기 사인 / 짝수=9번째부터
    verified_examples:
      - { input: { sign: 1, deg: 1.0 },     expect_division_index: 1, expect_result_sign: 1, branch: odd }
      - { input: { sign: 6, deg: 14.3333 }, expect_division_index: 5, expect_result_sign: 6, branch: even }

  d12:                                   # Dvadasamsa — 슬로카 15, 책 p.73
    divisions: 12
    size_deg: 2.5
    start_mode: relative
    start_rule: { all: 0 }
    verified_examples:
      - { input: { sign: 1, deg: 6.0 },  expect_division_index: 3,  expect_result_sign: 3,  branch: all }
      - { input: { sign: 5, deg: 29.0 }, expect_division_index: 12, expect_result_sign: 4,  branch: all }

  d16:                                   # Shodasamsa / Kalamsa — 책 p.75
    divisions: 16
    size_deg: 1.875                      # 1°52′30″
    start_mode: absolute                 # ← D9·D10 과 다르다. 자기 사인 기준이 아니다
    start_rule: { movable: 1, fixed: 5, dual: 9 }   # 양 / 사자 / 사수자리 (절대 사인 번호)
    start_rule_note: >
      원전은 활동궁이면 양자리부터, 고정궁이면 사자자리부터, 이중궁이면 사수자리부터
      세라고 명시한다. 시작 사인이 고정되어 있으므로 자기 사인 기준 offset 이 아니다.
      예 — 황소자리(고정궁)의 첫 쇼다삼샤는 사자자리이지 황소에서 5번째가 아니다.
      D10 은 홀수·짝수로 갈리고 D16 은 활동·고정·이중으로 갈리며, 기준도 서로 다르다.
    verified_examples:
      - { input: { sign: 1, deg: 10.0 }, expect_division_index: 6, expect_result_sign: 6, branch: movable }
      - { input: { sign: 2, deg: 1.0 },  expect_division_index: 1, expect_result_sign: 5, branch: fixed }
      - { input: { sign: 3, deg: 1.0 },  expect_division_index: 1, expect_result_sign: 9, branch: dual }
      - { input: { sign: 4, deg: 1.0 },  expect_division_index: 1, expect_result_sign: 1, branch: movable }

  d30:                                   # Trimsamsa — 슬로카 27-28, 책 p.80
    divisions: 5
    unequal: true
    odd_bands:                           # [폭, 결과 사인] — 화성·토성·목성·수성·금성
      - [5.0, 1]
      - [5.0, 11]
      - [8.0, 9]
      - [7.0, 3]
      - [5.0, 7]
    even_bands:                          # 금성·수성·목성·토성·화성 (역순)
      - [5.0, 2]
      - [7.0, 6]
      - [8.0, 12]
      - [5.0, 10]
      - [5.0, 8]
    note: >
      D30 만 불균등 분할이다. 사인 내 도수가 어느 구간에 속하는지로 판정하며
      공통 산식을 적용하지 않는다. 각 구간 폭의 합은 30 이어야 한다.
    verified_examples:
      - { input: { sign: 1, deg: 12.0 }, expect_result_sign: 9, branch: odd }
      - { input: { sign: 2, deg: 6.0 },  expect_result_sign: 6, branch: even }

  d60:                                   # Shashtiamsa — 슬로카 33-41, 책 p.83
    divisions: 60
    size_deg: 0.5
    special: true
    formula: "result = ((sign - 1 + (floor(deg_in_sign * 2) % 12)) % 12) + 1"
    formula_prose: >
      사인 위치를 무시하고 사인 내 도수만 취해 2를 곱한다. 그 정수부를 12로 나눈
      나머지에 1을 더하면, 행성이 있는 사인에서 그만큼 세어간 사인이 결과가 된다.
    odd_even_note: >
      홀수·짝수 차이는 샤슈티암샤 명칭 순서가 역순이 되는 것이며 산출식은 동일하다.
    sensitivity_note: >
      분할폭 0.5° 로 가장 민감하다. 라그나의 D60 은 약 2분마다 바뀌어
      출생시각 정밀도가 직접 영향을 준다. 토성·목성 등 느린 행성은 수 주 동안 불변.
    verified_examples:
      - input: { sign: 10, deg: 13.416667 }        # 원전 예시 — 염소 13°25′
        intermediate: { doubled_deg: 26.833333, floor: 26, remainder: 2, count: 3 }
        expect_result_sign: 12
        branch: odd_even_same
      - input: { sign: 1, deg: 5.0 }
        intermediate: { doubled_deg: 10.0, floor: 10, remainder: 10, count: 11 }
        expect_result_sign: 11
        branch: odd_even_same

  sign_quality:                          # start_rule 의 movable/fixed/dual 판정
    movable: [1, 4, 7, 10]
    fixed:   [2, 5, 8, 11]
    dual:    [3, 6, 9, 12]

  primary_for_career: [d1, d10]          # 41_1_ §1 · §2.3
  dasavarga_set: [d1, d2, d3, d7, d9, d10, d12, d16, d30, d60]
# =============================================================================
# 6. 산술 검증 상수 (04_프로젝트_기본지침 §3.2 · §3.3)
# =============================================================================
arithmetic:
  zodiac: sidereal
  ayanamsa: lahiri                       # §1.4
  nakshatra_count: 27
  pada_count_total: 108                  # 27 × 4. 인덱스 계산의 기준값
  nakshatra_span_deg: 13.3333333         # 표시·문서용. 인덱스 계산에 사용 금지
  pada_span_deg: 3.3333333               # 표시·문서용. 인덱스 계산에 사용 금지
  index_formula:
    nakshatra: "floor(longitude * 27 / 360) + 1"
    pada:      "floor(longitude * 108 / 360) % 4 + 1"
    sign:      "floor(longitude * 12 / 360) + 1"
    note: >
      반복소수를 절단한 *_span_deg 로 나누면 각 구간 끝에서 인덱스가 범위를 벗어난다
      (28번째 낙샤트라, 5번째 파다). 정수 개수를 곱하는 형태로 계산하면 절단 상수가
      계산에 개입하지 않는다. 범위 클램프는 방어용 assert 로만 남기고,
      클램프가 실제로 발동하면 테스트 실패로 취급한다.

  ascendant_method: tropical_houses_minus_ayanamsa
  ascendant_method_formula: "swe.houses_ex(트로피컬) 의 Asc − swe.get_ayanamsa_ut(jd)"
  ascendant_method_note: >
    [v0.8.0 에서 변경 — 이전 값은 swe_houses_ex_sidereal_flag]
    JHora 실측 대조 결과 내장 사이데리얼 플래그 방식은 케이스마다 편차의 부호까지
    바뀌었고(+13.79 / -8.11 / +0.58 각초), 수동 차감 방식은 전 케이스에서
    행성들과 동일한 잔차 대역(-0.137 ~ -0.139 각초)에 들어왔다.
    선택 기준은 천문학적 정확성이 아니라 레퍼런스 정합성이다 —
    베딕 실무 소프트웨어가 사실상 모두 수동 차감 방식이고, 지식베이스의 규칙들도
    그 값 위에서 만들어졌으며, 고객이 다른 앱으로 확인했을 때 라그나가 달라지면
    그것은 결함으로 인식된다. 이 선택이 바뀌면 사인 경계 부근 라그나가 달라지므로
    engine_meta 에 기록한다.
  house_system: whole_sign                # §1.2 베딕 정의
  mandatory_check: >
    §3.3 — 출생 시점 마하다샤 로드와 달의 낙샤트라 로드가 일치해야 한다.
    불일치 시 해석하지 않고 재계산을 요청한다.

  # --- 에페메리스 설정 (ISSUE-009) ---
  # 초각 정밀도 목적이 아니라, 상용 소프트웨어 교차 대조 시 변수를 하나 줄이기 위함.
  # ISSUE-007(BAV 판본 검증)을 수행하려면 에페메리스가 변수에서 빠져 있어야 한다.
  ephemeris:
    backend: skyfield_jpl_de430          # 2026-09-29: swiss_se1(AGPL)에서 교체. Skyfield=MIT, DE430=퍼블릭도메인
    source: JPL_DE430
    coverage_note: "1549-12-31 ~ 2650-01-25 (TDB) — de430.bsp 세그먼트 실측 (2026-09-29 검증). 단, 다샤 120년 타임라인+솔버 역탐색 때문에 실제 출생일 지원 범위는 이보다 좁다 (API에서 1600-2500년으로 제한)."
    files_required: true
    path_env: SE_EPHE_PATH              # 그대로 사용 (값은 de430.bsp가 있는 디렉터리)
    files:                              # 파일 1개당 레코드 1개. 병렬 구조를 만들지 않는다
      de430.bsp:
        role: planets+moon
        coverage: "1549-12-31 ~ 2650-01-25 (TDB) — 세그먼트 실측"
        size_bytes: 119741440
        sha256: "6e1b277c5f07135a84950604b83e56b736be696a7f3560bcddb1d4aeb944fca1"
        url: "https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de430.bsp"

    files_repo: "https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/"   # NASA JPL (퍼블릭도메인)
    verify_on_install: true             # 다운로드 후 sha256 대조. 불일치 시 설치 실패
    gitignore: true                     # 리포지토리에 커밋하지 않고 설치 스크립트로 받는다

    license:
      current: "MIT (Skyfield) + Public Domain (JPL DE405)"
      previous: "AGPL-3.0 (pyswisseph) — 2026-09-29 교체로 해소"
      note: "상용 서비스에 라이선스 의무 없음. 법률 자문 아님."

    ayanamsa_constant: Lahiri             # 값이 아니라 상수명을 고정 기록. Lahiri 변종 다수 존재
    ayanamsa_implementation: "Lahiri 2차 다항식 피팅 (T=(JD-2451545)/36525) — 구 SIDM_LAHIRI 대비 1800-2200년 최대 잔차 0.0001초"

    position_mode: apparent             # Skyfield .apparent() = 광행시간·광행차 적용
    position_mode_note: >
      apparent = 광행시간·광행차 적용. true(기하학적 위치)와는 수십 각초 차이가 나며
      허용오차 1각초를 넘는다. 대조 소프트웨어도 apparent 로 맞춰야 한다.
    sidereal_time_note: >
      상승점 계산의 항성시는 Swiss 소스(swephlib.c swe_sidtime0, IAU 1976 + 장동)를
      그대로 이식. swe.sidtime() 대비 1800-2200년 최대 잔차 2.1초.

    node_type: mean                     # 확정 (ISSUE-009 해결)
    node_type_status: 확정
    node_type_evidence: "JHora Planet Calculation Options = Mean nodes (2026-07 확인)"
    node_type_note: >
      mean 과 true 는 최대 1도 이상 벌어진다. 라후가 사인·낙샤트라 경계 근처면
      배치 자체가 갈리고, 19 §6 의 라후-케투 축 트랜짓 판정이 뒤집힐 수 있다.
      인도 전통 판찬가와 K.N. Rao 계열은 통상 mean 을 사용하나, 확정은 정책 결정 사항.

    reproducibility_note: >
      backend · ayanamsa_constant · node_type 이 바뀌면 다샤 경계와 라후·케투 배치가
      달라져 과거 리포트를 재현할 수 없다. 발행 리포트 푸터에 이 세 값을 기록한다.
      고객이 이전 리포트와의 차이를 문의할 때 설정 변경인지 판정 변경인지 구분하는
      유일한 수단이다.

  # --- 대조 기준 소프트웨어 설정 (픽스처 기대값 생성 조건) ---
  crosscheck_reference:
    software: "Jagannatha Hora"
    ayanamsa: "Traditional Lahiri"       # True Lahiri/Chitrapaksha 아님
    siddhanta: Drik                      # SSS(Sri Surya Siddhanta) 아님
    positions: "Apparent positions"
    nodes: "Mean nodes"
    chara_karaka: "Seven chara karakas (No Pik) - Sri KNRao"
    navamsa: "Regular Parasari Navamsa"
    dasamsa: "D-10 (Trd) — 설정 불가, 전통 방식 고정"
    timezone_input: "0 (UTC 직접 입력). JHora 시간대 로직을 타지 않는다"
    coordinates: "127 E 00 00 / 37 N 30 00"
    note: >
      픽스처 기대값은 위 설정에서 생성되었다. 하나라도 다르면 값이 재현되지 않는다.
      테스트가 실패하면 코드보다 이 설정을 먼저 확인할 것.

    # --- 관측된 기준 잔차 ---
    # 2026-07 (swe/DE431 백엔드): 전 바디 공통 -0.14". Traditional Lahiri 와
    #   SIDM_LAHIRI 의 정의 미세차로 추정.
    # 2026-09-29 (skyfield/DE430 백엔드): 행성 4~9" (DE430 vs DE431 모델 차이),
    #   달 최대 78" (2200년), 상승점 0.5" (공식 정확). baseline_2000 실측:
    #   태양 7.3", 달 36.9", 화성 6.9", 수성 8.9", 목성 4.8", 금성 7.6",
    #   토성 4.6", 상승점 0.5".
    observed_residual_arcsec: -0.14
    observed_residual_note: >
      [2026-07, swe 백엔드] 전 바디(행성 7 + 라후 + 라그나) 공통으로
      -0.13 ~ -0.14 각초. Traditional Lahiri 와 SIDM_LAHIRI 의 정의 미세차로
      추정. 허용오차 1각초 이내.
      [2026-09-29, DE430 백엔드] 행성은 DE430 vs DE431 모델 차이로 4~9",
      달은 최대 78", 상승점은 0.5". 공통 대역이 아니라 바디별 모델 차이이므로,
      이제는 "값"이 아니라 "급격한 변화"를 본다. 허용오차 90각초.
      이 값이 향후 크게 달라지면 아야남샤 상수·에페메리스·설정 중 무언가가
      바뀐 것이다.


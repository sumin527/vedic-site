  text: 2하우스 로드가 7하우스에 있습니다. 재산의 주인이 파트너십의 자리에 앉은 배치로, 함께 버는 구조의 동업에 유리한 흐름입니다.
- id: R_R6_7L_10H
  tier: t1_d1
  conclusion: R6
  when:
    lord_house:
      lord_of: 7
      in_house: 10
  direction: support
  source: 16 §1 · §7
  text: 7하우스 로드가 10하우스에 있습니다. 파트너십이 사회적 지위·커리어와 연결되는 구조로, 공적 영역에서의 협업이 빛을 발하는 경향이

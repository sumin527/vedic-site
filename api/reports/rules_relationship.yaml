meta:
  version: 2.0.0
  description: rules_relationship — 심화판 (evidence map R1~R6)
  source: report_module-2 worksheet_spec.yaml evidence map + kb-sources 원전
  shallow_backup: _backup_shallow/
rules:
- id: R_R1_7L_1H
  tier: t1_d1
  conclusion: R1
  when:
    lord_house:
      lord_of: 7
      in_house: 1
  direction: support
  source: 16 §1
  text: 7하우스 로드가 1하우스에 있습니다. 관계에서 주도적으로 나서고 파트너십을 자기 삶의 중심축으로 여기는 경향이 있습니다. 상대의 존재감이
    크고 밀접하게 얽히는 구조이므로, 관계 안에서도 '나'의 영역을 지키는 리듬을 돌아볼 수 있습니다.
  note: '16 §1: 배우자가 native와 밀접·존재감 강함·자아 형성에 영향 / 손상 시 지배적 관계 또는 정체성 갈등 — 완곡 서술'
- id: R_R1_7L_3H
  tier: t1_d1
  conclusion: R1
  when:
    lord_house:
      lord_of: 7
      in_house: 3
  direction: support
  source: 16 §1
  text: 7하우스 로드가 3하우스에 있습니다. 상대와의 소통이 활발하고 상대를 파트너이자 조언자로 여기는 경향이 있습니다. 짧은 여행이나 이동을
    함께 즐기는 리듬이 관계에 활력을 줍니다.
- id: R_R1_7L_4H
  tier: t1_d1
  conclusion: R1
  when:
    lord_house:
      lord_of: 7
      in_house: 4
  direction: support
  source: 16 §1
  text: 7하우스 로드가 4하우스에 있습니다. 상대와 함께 정착하고 가정을 일구는 방향으로 관계가 흘러가는 경향이 있습니다. 안정된 보금자리를
    함께 만드는 데서 유대가 깊어지는 구조입니다.
- id: R_R1_7L_6H
  tier: t1_d1
  conclusion: R1
  when:
    lord_house:
      lord_of: 7
      in_house: 6
  direction: caution
  source: 16 §1
  text: 7하우스 로드가 6하우스에 있습니다. 관계에서 의견 충돌이나 역할 다툼이 불거지기 쉬운 구조이므로, '인내와 소통이 특별히 중요한 국면'으로
    봅니다. 갈등을 피하기보다 다루는 방식을 함께 정해두면 후반으로 갈수록 안정되는 흐름입니다.
  caution: '16 §1: 갈등·소송 위험 / 우파차야로 후반 극복 — 확정 예언 금지, 완곡 필수'
- id: R_R1_7L_11H
  tier: t1_d1
  conclusion: R1
  when:
    lord_house:
      lord_of: 7
      in_house: 11
  direction: support
  source: 16 §1
  text: 7하우스 로드가 11하우스에 있습니다. 사교 모임·그룹·친구의 소개를 통해 인연이 이어지는 경향이 있습니다. 넓은 교우 관계 안에서
    관계가 자라나고, 결합 후에도 사회적 확장이 따르는 구조입니다.
- id: R_R1_7L_12H
  tier: t1_d1
  conclusion: R1
  when:
    lord_house:
      lord_of: 7
      in_house: 12
  direction: neutral
  source: 16 §1
  text: 7하우스 로드가 12하우스에 있습니다. 조용하고 사적인 결합, 또는 해외·원거리와 결부된 인연의 경향이 있습니다. 둘만의 시간을 깊이
    나누는 관계에서 만족이 커지는 구조입니다.
  caution: '16 §1: 별거·원거리·성적 문제 — 확정 예언 금지, 완곡 서술'
- id: R_R1_7H_SUN
  tier: t1_d1
  conclusion: R1
  when:
    planet_in_house:
      sun: 7
  direction: support
  source: 16 §2
  text: 태양이 7하우스에 있습니다. 관계에서 서로의 자존심을 세워주는 리듬이 중요한 구조입니다. 사회적 지위가 있는 상대와의 인연, 또는 관계
    자체가 공적 얼굴이 되는 경향이 있습니다.
  caution: 손상 시 자존심 다툼 — '서로의 입장을 세워주는 대화' 프레임으로 서술
- id: R_R1_7H_MOON
  tier: t1_d1
  conclusion: R1
  when:
    planet_in_house:
      moon: 7
  direction: support
  source: 16 §2
  text: 달이 7하우스에 있습니다. 감정적 유대가 관계의 중심이 되는 구조입니다. 상대의 기분을 세심히 읽고 보살피는 따뜻함이 있지만, 감정의
    파도에 함께 흔들리지 않도록 각자의 리듬을 지키는 것도 돌아볼 수 있습니다.
- id: R_R1_7H_MERCURY
  tier: t1_d1
  conclusion: R1
  when:
    planet_in_house:
      mercury: 7
  direction: support
  source: 16 §2
  text: 수성이 7하우스에 있습니다. 대화와 지적 교류가 관계의 윤활유인 구조입니다. 재치 있는 소통으로 갈등을 풀어가는 경향이 있고, 사업
    파트너로서의 호흡도 함께 좋은 배치입니다.
  caution: 손상 시 계산적 관계·언쟁 — 완곡 서술
- id: R_R1_7H_RAHU
  tier: t1_d1
  conclusion: R1
  when:
    planet_in_house:
      rahu: 7
  direction: neutral
  source: 16 §2
  text: 라후가 7하우스에 있습니다. 관습에서 벗어난 형태의 인연 — 나이 차·문화 차·만남 계기의 이례성 — 이 나타나는 경향이 있습니다.
    관계의 시작이 갑작스러울 수 있으나, 그 자체가 이 관계의 개성으로 읽힙니다.
  caution: 손상 시 삼각관계·급변 — 확정 예언 금지, 16 §9.3 프레임
- id: R_R1_7H_KETU
  tier: t1_d1
  conclusion: R1
  when:
    planet_in_house:
      ketu: 7
  direction: caution
  source: 16 §2
  text: 케투가 7하우스에 있습니다. 관계 안에서 혼자만의 시간과 심리적 거리가 필요한 리듬이 있습니다. 영적·내면적 가치를 공유할 때 유대가
    깊어지며, 상대에게도 같은 여백을 주는 것이 관계의 숨통이 됩니다.
  caution: '16 §2: 무관심·거리감·회피 — ''여백이 필요한 리듬''으로 완곡화, 확정 예언 금지'
- id: R_R1_VENUS_OWN
  tier: t2_karaka
  conclusion: R1
  when:
    planet_in_house:
      venus: 2
  direction: support
  source: 16 헤더 · §4.2
  text: 금성이 황소자리(자기 별자리)에 있습니다. 관계의 주 카라카가 힘을 받는 배치로, 애정을 표현하고 조화를 만드는 능력이 안정적으로 작동하는
    경향이 있습니다.
- id: R_R1_VENUS_EXALTED
  tier: t2_karaka
  conclusion: R1
  when:
    planet_in_house:
      venus: 12
  direction: support
  source: 16 헤더 · §4.2
  text: 금성이 물고기자리(고양)에 있습니다. 관계의 주 카라카가 가장 높은 자리에서 빛나는 배치로, 헌신적이고 낭만적인 애정의 흐름이 강한
    경향이 있습니다.
- id: R_R1_7L_DEBILITATED
  tier: t1_d1
  conclusion: R1
  when:
    lord_dignity:
      lord_of: 7
      dignity: debilitated
  direction: caution
  source: 16 §1
  text: 7하우스 로드가 쇠약한 상태에 있습니다. 관계의 토대를 다지는 데 시간이 걸리는 구조이므로, 서두르기보다 신뢰를 차곡차곡 쌓는 국면으로
    볼 수 있습니다. 나밤샤(D9)에서의 회복 여부를 함께 확인합니다.
  note: '16 §1 나밤샤 병행 규칙: 라시 훼손 + D9 켄드라·트리코나 = 회복'
- id: R_R1_D9_7L_CONTRAST
  tier: t3_varga
  conclusion: R1
  when:
    varga_contrast:
      planet: lord_of_7
      vargas:
      - d9
  direction: computed
  source: 16 §8.1 · 헤더
  text_strong_weak: D1(관계의 외적 상황)과 D9(관계의 실질적 질·지속성)에서 7하우스 로드의 강약을 비교합니다. 겉모습과 실제
    질이 다를 수 있으므로 두 층을 함께 보는 것이 이 관계 판단의 핵심입니다.
  automation: partial
  automation_note: '강약 판정은 사람 확정. 16 §8.1 반전 규칙: 라시에서 좋아도 D9 6/8/12이면 반전(외양은 좋으나 실질은
    어려움), 라시에서 훼손돼도 D9 켄드라·트리코나이면 회복(초기 어려움 후 안정).

    '
- id: R_R2_SIGN_1
  tier: t1_d1
  conclusion: R2
  when:
    house_sign:
      house: 7
      sign: 1
  direction: support
  source: 16 §5.1
  text: 7하우스가 양자리입니다. 관계에서 주도권과 속도감이 두드러지는 구조입니다. 먼저 다가가고 결정을 이끄는 리듬이 있으며, 상대에게도 같은
    솔직함과 추진력을 기대하는 경향이 있습니다.
- id: R_R2_SIGN_2
  tier: t1_d1
  conclusion: R2
  when:
    house_sign:
      house: 7
      sign: 2
  direction: support
  source: 16 §5.1
  text: 7하우스가 황소자리입니다. 안정과 감각적 유대를 중시하는 구조입니다. 천천히 신뢰를 쌓아가는 관계에서 만족이 크고, 꾸준함이 이 관계의
    언어가 됩니다.
- id: R_R2_SIGN_3
  tier: t1_d1
  conclusion: R2
  when:
    house_sign:
      house: 7
      sign: 3
  direction: support
  source: 16 §5.1
  text: 7하우스가 쌍둥이자리입니다. 소통과 지적 교류가 관계의 중심축인 구조입니다. 대화가 끊이지 않는 관계에서 활력을 얻고, 서로의 이야기에
    귀 기울이는 것이 유대를 키웁니다.
- id: R_R2_SIGN_4
  tier: t1_d1
  conclusion: R2
  when:
    house_sign:
      house: 7
      sign: 4
  direction: support
  source: 16 §5.1
  text: 7하우스가 게자리입니다. 정서적 돌봄과 가정의 울타리를 중시하는 구조입니다. 상대의 마음을 헤아리고 보살피는 데서 관계의 깊이가 만들어집니다.
- id: R_R2_SIGN_5
  tier: t1_d1
  conclusion: R2
  when:
    house_sign:
      house: 7
      sign: 5
  direction: support
  source: 16 §5.1
  text: 7하우스가 사자자리입니다. 서로를 인정하고 빛나게 하려는 리듬이 있는 구조입니다. 따뜻한 표현과 자존감을 세워주는 교환이 관계의 온도를
    유지합니다.
- id: R_R2_SIGN_6
  tier: t1_d1
  conclusion: R2
  when:
    house_sign:
      house: 7
      sign: 6
  direction: support
  source: 16 §5.1
  text: 7하우스가 처녀자리입니다. 세심한 배려와 실질적인 도움으로 애정을 표현하는 구조입니다. 일상의 작은 챙김이 쌓여 신뢰가 되는 관계입니다.
- id: R_R2_SIGN_7
  tier: t1_d1
  conclusion: R2
  when:
    house_sign:
      house: 7
      sign: 7
  direction: support
  source: 16 §5.1
  text: 7하우스가 천칭자리입니다. 조화와 공정함을 관계의 원칙으로 삼는 구조입니다. 서로의 입장을 맞추려는 노력이 자연스럽고, 균형 잡힌 파트너십을
    지향합니다.
- id: R_R2_SIGN_8
  tier: t1_d1
  conclusion: R2
  when:
    house_sign:
      house: 7
      sign: 8
  direction: support
  source: 16 §5.1
  text: 7하우스가 전갈자리입니다. 깊고 강렬한 유대를 추구하는 구조입니다. 표면적인 교류보다 본질을 나누는 관계에서 만족이 크며, 서로에게
    전념하는 밀도가 높습니다.
- id: R_R2_SIGN_9
  tier: t1_d1
  conclusion: R2
  when:
    house_sign:
      house: 7
      sign: 9
  direction: support
  source: 16 §5.1
  text: 7하우스가 사수자리입니다. 이상과 자유를 함께 키워가는 구조입니다. 서로의 성장과 탐험을 응원하는 낙천적 리듬이 있으며, 철학·신앙의
    공유가 유대를 깊게 합니다.
- id: R_R2_SIGN_10
  tier: t1_d1
  conclusion: R2
  when:
    house_sign:
      house: 7
      sign: 10
  direction: support
  source: 16 §5.1
  text: 7하우스가 염소자리입니다. 책임과 인내로 관계를 지켜가는 구조입니다. 약속을 중시하고 시간을 들여 쌓아가는 관계에서 안정이 만들어집니다.
- id: R_R2_SIGN_11
  tier: t1_d1
  conclusion: R2
  when:
    house_sign:
      house: 7
      sign: 11
  direction: support
  source: 16 §5.1
  text: 7하우스가 물병자리입니다. 서로의 독립성을 존중하는 수평적 구조입니다. 관습에 얽매이지 않는 만남의 형태가 자연스러우며, 우정에서 시작되는
    인연의 경향도 있습니다.
- id: R_R2_SIGN_12
  tier: t1_d1
  conclusion: R2
  when:
    house_sign:
      house: 7
      sign: 12
  direction: support
  source: 16 §5.1
  text: 7하우스가 물고기자리입니다. 공감과 헌신적 돌봄이 흐르는 구조입니다. 상대의 감정에 깊이 동화되는 낭만적 리듬이 있으며, 영적·예술적
    교감이 유대를 키웁니다.
- id: R_R2_DK_1H
  tier: t2_karaka
  conclusion: R2
  when:
    karaka_house:
      karaka: dk
      in_house: 1
  direction: support
  source: 16 §5.3 · 44 §5.1
  text: 다라카라카가 1하우스에 있습니다. 장기 관계에서 만나는 상대가 자기 정체성과 깊이 맞닿아 있는 경향이 있습니다. 상대를 통해 자신을
    배우는 관계 — 거울 같은 인연의 구조입니다.
  note: '44 §5.1 고객용: 이 행성은 장기 관계에서 만나는 상대의 핵심 성향뿐 아니라, 관계를 통해 배우게 되는 태도를 함께 보여줍니다.'
- id: R_R2_DK_5H
  tier: t2_karaka
  conclusion: R2
  when:
    karaka_house:
      karaka: dk
      in_house: 5
  direction: support
  source: 16 §5.3 · 44 §5.1
  text: 다라카라카가 5하우스에 있습니다. 연애적 설렘과 창조적 교감을 통해 이어지는 인연의 경향이 있습니다. 이 관계에서 배우게 되는 태도는
    '즐거움을 함께 만드는 법'입니다.
  note: '44 §5.1 판독 순서: D1 7H·7L → 금성/목성 → D9 7H·7L → DK의 D1·D9 위치'
- id: R_R2_D9_VENUS
  tier: t3_varga
  conclusion: R2
  when:
    varga_contrast:
      planet: venus
      vargas:
      - d9
  direction: computed
  source: 16 §8.1
  text_strong_weak: 관계의 주 카라카인 금성을 D1과 D9에서 비교합니다. 외적 조건(D1)과 실질적 질(D9)의 차이를 함께 보는
    것이 이 관계 판단의 핵심입니다.
  automation: partial
  automation_note: '16 §8.1 필수 확인: D9에서의 금성·목성 상태. 강약 판정은 사람 확정.'
- id: R_R3_MAHA_7LORD
  tier: t4_dasha
  conclusion: R3
  when:
    maha_lord_of: 7
  direction: support
  source: 16 §3.2
  text: 현재 마하다샤 로드가 7하우스 로드와 같은 행성입니다. 관계·파트너십의 주제가 인생의 전면에 부각되는 큰 흐름의 시기입니다. 만남·결혼·동업
    등 '짝'과 관련된 결정이 이 시기에 무게를 갖는 경향이 있습니다.
  caution: 16 §9.2 — 다샤 단독 신호는 '가능성 있는 시기'로 완곡화. 확정 예언 금지
- id: R_R3_ANTAR_7LORD
  tier: t4_dasha
  conclusion: R3
  when:
    antar_lord_of: 7
  direction: support
  source: 16 §3.2

gaps:
  t2_karaka_dignity:
    reason: 'karaka 행성(금성·목성 등) 자체의 dignity를 직접 묻는 키가 없다. planet_in_house 로 사인 배치는
      표현 가능하나 일반적인 존엄 판정은 불가. judge.py 에 planet_dignity: {planet, dignity} 키 추가 필요.

      '
  t3_d9_house:
    reason: 'D9 7H·D9 라그나 자체의 사인·로드 상태를 묻는 키가 없다 (16 §8.1 필수 확인 항목 1·2). varga_contrast:
      {house: 7, vargas: [d9]} 형태의 확장 또는 별도 키 필요.

      '
  t3_dk_d9:
    reason: 'judge 의 varga_contrast 가 카라카 지정자(dk)를 해석하지 못한다. judge.py 수정 또는 별도 when
      키 필요.

      '
  t3_ul:
    issue: ISSUE-028
    reason: '16 §5.4 우파파다 라그나 — 엔진 미산출. UL의 사인·하우스, UL로부터 2H (16 §9.1 3단계 안정성 판단)는
      추가금 상품 사양.

      '
  t4_double_transit:
    reason: '목성·토성의 이중 트랜짓(7H·7L·라그나·달 지점 통과)은 엔진 미산출. 16 §9.2 — 다샤·트랜짓·이중 트랜짓 3중
      일치가 시기 확정의 조건이므로, 트랜짓 없이는 모든 시기 판정을 "가능성 있는 시기"로 완곡화해야 한다.

      '
  t4_pratyantar:
    reason: '16 §3.2 핵심 원칙(다샤·안타르·프라티안타르 3층 일치)은 프라티안타르 키가 없어 부분 적용. antar까지만 자동 판정,
      프라티안타르는 사람 확정.

      '
  t4_moon_lagna_7l:
    reason: '찬드라 라그나 기준 7H 로드를 구하는 키가 없다. when 문법 확장 필요.

      '
  t1_combo:
    reason: 'when 에서 planet_in_house 를 두 번 쓸 수 없어 2행성 결합을 표현할 수 없다. planet_in_houses:
      [{planet, house}, ...] 형태의 복수 키 또는 conjunction: {planets: [...], house: N} 키
      필요.

      '
  t1_papakar_tari:
    reason: '하우스의 양쪽 인접 하우스에 흉성이 있는지를 묻는 키가 없다. flanking: {house: 7, by: malefic}
      형태의 키 필요.

      '
  t1_aspect:
    reason: '행성 간 어스펙트를 묻는 키가 없다. aspect: {from: jupiter, to_house: 7} 형태의 키 필요.

      '
  t4_sade_sati:
    reason: '달 위 토성 트랜짓(사드사티)은 트랜짓 계산이 없어 자동 판정 불가. 사람 확정.

      '
  t3_d10:
    reason: 'varga 키에 d10 이 없다. 사업 파트너십 심화 시 vargas: [d10] 지원 필요.

      '
  t5_venus_bav:
    reason: 'sav_house 만 있고 행성별 BAV 키가 없다. 43 §9 매트릭스의 완전한 적용에는 bav: {planet: venus}
      키 필요.

      '

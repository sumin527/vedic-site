  conclusion: F4
  when:
    maha_lord: ketu
  direction: caution
  source: 11 §5
  text: 케투의 마하다샤 — 분실·투기성 손실 등 돌발 지출에 유의 — 큰 결정을 서두르지 않는 것이 좋습니다.

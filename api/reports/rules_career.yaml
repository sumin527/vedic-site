    sav_house:
      house: 10
      min: 31
  direction: support
  source: 43 §5.2
  text: 10하우스 영역의 기반 점수가 31점 이상으로 강해, 차트가 약속한 직업적 성취의 실현력이 큰 구조로 봅니다.

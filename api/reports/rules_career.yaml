rules:
- id: R_C1_10L_1H
  tier: t1_d1
  conclusion: C1
  when:
    lord_house:
      lord_of: 10
      in_house: 1
  direction: support
  source: 19 §1
  text: 10하우스 로드가 라그나(1H)에 있어 직업과 자기 정체성이 일치하는 구조입니다. 자기 브랜드·프리랜서 형태의 성공과 인연이 있는 경향으로
    봅니다.
- id: R_C1_10L_9H
  tier: t1_d1
  conclusion: C1
  when:
    lord_house:
      lord_of: 10
      in_house: 9
  direction: support
  source: 19 §1
  text: 10하우스 로드가 9하우스에 있어 다르마-카르마 요가가 성립하는 구조입니다. 정의로운 방향으로 큰 성취가 열리는 최고의 축복 중 하나로
    봅니다.
- id: R_C1_10L_11H
  tier: t1_d1
  conclusion: C1
  when:
    lord_house:
      lord_of: 10
      in_house: 11
  direction: support
  source: 19 §1
  text: 10하우스 로드가 11하우스(이득)에 있어 커리어가 큰 이득으로 연결되는 구조입니다. 우파차야 하우스에 자리해 시간이 갈수록 성과가
    커지는 경향으로 봅니다.
- id: R_C1_10L_6H
  tier: t1_d1
  conclusion: C1
  when:
    lord_house:
      lord_of: 10
      in_house: 6
  direction: support
  source: 19 §1
  caution: 19 §1 — 직장 갈등·소송 유의
  text: 10하우스 로드가 6하우스에 있어 서비스·의료·법조·경쟁 분야와 인연이 있는 구조입니다. 경쟁에서 이겨내는 형태로 성취하는 경향으로
    봅니다.
- id: R_C1_10L_12H
  tier: t1_d1
  conclusion: C1
  when:
    lord_house:
      lord_of: 10
      in_house: 12
  direction: neutral
  source: 19 §1
  text: 10하우스 로드가 12하우스에 있어 해외 커리어, 연구소·병원 같은 격리형 직업과 인연이 있는 구조입니다. 해외에서의 큰 성공 가능성도
    함께 봅니다.
- id: R_C1_10H_SUN_MARS
  tier: t1_d1
  conclusion: C1
  when:
    planet_in_house:
      sun: 10
      mars: 10
  direction: support
  source: 19 §2
  text: 10하우스에 태양과 화성이 함께 있어 강한 리더십의 조합입니다. 정부·군사·기술 조직에서 두각을 나타내는 구조로 봅니다.
- id: R_C1_10H_JUP_MER
  tier: t1_d1
  conclusion: C1
  when:
    planet_in_house:
      jupiter: 10
      mercury: 10
  direction: support
  source: 19 §2
  text: 10하우스에 목성과 수성이 함께 있어 지혜로운 상인·저술가·교수의 조합입니다. 지식과 소통을 무기로 하는 커리어와 인연이 있는 구조로
    봅니다.
- id: R_C1_10SIGN_SAGITTARIUS
  tier: t1_d1
  conclusion: C1
  when:
    house_sign:
      house: 10
      sign: 9
  direction: support
  source: 19 §4.2
  text: 10하우스가 사수자리에 있어 교육·법률·출판·외국 관련 분야의 성향으로 봅니다.
- id: R_C1_10SIGN_SCORPIO
  tier: t1_d1
  conclusion: C1
  when:
    house_sign:
      house: 10
      sign: 8
  direction: support
  source: 19 §4.2
  text: 10하우스가 전갈자리에 있어 조사·연구·심리·정보 분야의 성향으로 봅니다.
- id: R_C1_AMK_10H

- id: R_C1_D1_D10_CONTRAST
  tier: t3_varga
  conclusion: C1
  when:
    varga_contrast:
      planet: tenth_lord
      vargas:
      - d9
      - d10
  direction: computed
  source: 41_1_ §3.6
  text_strong_weak: 잠재력은 있으나 직업 환경·역할 선택이 중요한 구조로 봅니다.
  automation: partial
  automation_note: 'D1·D9·D10에서 10로드의 사인·하우스는 엔진이 산출하나, 강약 판정에는 존엄(자기·고양·우호·적대)과 하우스
    성격 규칙이 필요. 후보를 제시하고 방향은 사람이 확정한다.

    '

  note: 원문 '특히 흉성 트랜싯 시 발현 확률 높음'은 트랜싯 판정이 필요해 제외.
gaps:
  d1_t3_dosha:
    issue: COND-D-001
    reason: '15 §5.1 트리도샤 원소 판정(6H·6H로드의 사인 → 바타/피타/카파)은 사인 목록 매칭 when 키가 없어 규칙화 불가.
      judge.py에 sign_in_list 키 추가 시 원소×사인 규칙으로 확장 가능. (기존 파일의 t3_dosha GAP과 동형)

      '
  d1_t3_kalapurusha:
    issue: COND-D-002
    reason: '15 §5.2 칼라푸루샤 신체 매핑(양→머리…물고기→발·림프)은 단독 근거 금지(spec D1 note: 사인→신체 1:1
      매핑이라 계열 1개). 6H로드·6H재실· 카라카·다샤가 같은 부위를 독립적으로 가리킬 때만 판정으로 승격되는데, 계열 간 교차 일치 판정
      로직이 없어 자동화 불가. (기존 파일의 t3_kalapurusha GAP과 동형)

      '
  d1_t2_mercury:
    issue: COND-D-003
    reason: '15 §2 수성 6H의 손상 시 "신경 계통 문제"는 파파카르타리·컴버스트·역행 등 훼손 판정이 필요해 규칙화 불가. 기본
      결과(지적 경쟁력)는 커리어로 이관.

      '
  d1_s3_rows:
    issue: COND-D-004
    reason: '§1 배치표의 3H "형제 상실", 5H "자녀 상실·유산", 7H "이혼 위기", 12H "유배·감금" 행과 §2의 "자가면역
      질환", "성병", "심각한 정신 건강 문제"는 S3 영역으로 의도적으로 규칙화하지 않음 (spec safety_rules).

      '
  d2_t1_dual_lens:
    issue: COND-D-005
    reason: '15 §6.1 이중 렌즈(트리크↔우파차야) — "인생 후반으로 갈수록 우파차야 성격 우세, 초반에는 트리크 성격 발현"은 나이·다샤
      진행 단계 기반 판단으로 when 문법에 연령 키가 없어 규칙화 불가.

      '
  d2_t1_full_comparison:
    issue: COND-D-006
    reason: '15 §5.3 라그나 로드 vs 6H 로드 완전 비교(위엄·하우스 배치·결합/ 어스펙트·AV 4항목 종합)는 자동화 불가.
      본 파일은 위엄 1항목만으로 부분 판정(R_D2_6L_DEBILITATED/EXALTED/OWN_SIGN)한다. (기존 파일의 t1_lagna_vs_6lord
      GAP과 동형)

      '
  d2_t6_arishta_lords:
    issue: COND-D-007
    reason: '15 §3.5 아리스타 방가 조건 "6하우스 로드가 강함 + 라그나 로드도 강함"은 when 매핑에 lord_dignity
      키가 중복되어 표현 불가. judge.py가 조건 리스트를 지원하면 규칙화 가능.

      '
  d2_t6_viparita_purity:
    issue: COND-D-008
    reason: '비파리트 라자요가 순수성 체크리스트(15 §3.1: 6·8·12 로드끼리만 결합·어스펙트, 켄드라·트리코나 로드와 결합 없음,
      다른 로드십을 겸하지 않음)는 결합·어스펙트 상대 판정이 필요해 부분 자동에 그친다 (후보 제시 + 사람 확정). (기존 파일의 t6_purity
      GAP과 동형)

      '
  d3_t1_header:
    issue: COND-D-009
    reason: '15 헤더의 "일상의 노고, 나쁜 습관, 부적절한 식습관"은 6하우스 일반 signification이라 차트 패턴 조건이 없어
      규칙화 불가. 행성별 생활 리듬 규칙(R_D3_*)의 배경 서술로만 활용.

      '
  d3_t2_rahu_addiction:
    issue: COND-D-010
    reason: '15 §2 라후 6H의 손상 시 "중독·독소" 서술은 훼손 판정이 필요해 규칙화 불가. (기존 파일의 t2_karaka GAP과
      동형)

      '
  d3_t3_dosha_lifestyle:
    issue: COND-D-011
    reason: '15 §5.1 도샤 성향 → 생활 패턴(바타=리듬 불규칙/피타=과열·속도/ 카파=관성·정체) 서술은 원소 판정(COND-D-001)이
      선행되어야 해서 함께 불가.

      '
  d4_t1_damage_column:
    issue: COND-D-012
    reason: '15 §1 배치표의 (−) 손상 열(만성적 신체 문제, 채무 누적, 어머니의 만성병, 형제 상실, 유산, 이혼 위기, 부동산
      압류 등)은 전부 "훼손 시" 조건(파파카르타리·컴버스트·역행·흉각 판정)이 필요해 규칙화 불가. S3 행은 의도적으로 제외.

      '
  d4_t4_skipped_combos:
    issue: COND-D-013
    reason: "15 §4.2 결합표 중 의도적으로 제외한 행: - 6H로드×2H로드 \"부채 발생 또는 확대\" → 금전 카테고리로 이관\
      \ - 6H로드×7H로드 \"배우자·파트너 관련 소송, 관계 위기\" → 관계·커리어로 이관 - 6H로드×8H로드 \"큰 위기, 수술\"\
      \ → 수술 확정 서술은 S3급으로 제외 - 6H로드×10H로드 \"직장 갈등·굴욕\" → 커리어로 이관 - 6H로드×11H로드 \"부채\
      \ 해소\" → 금전 카테고리로 이관 - 6H로드×12H로드 \"해외·병원·격리 관련 사건, 큰 지출\" → 지출은 금전,\n  병원 확정\
      \ 서술은 S3급으로 제외\n"
  d4_t4_layers_3467:
    issue: COND-D-014
    reason: "15 §4.1 7층위 중 규칙화 불가 층위: - 층위 3 (6H에 어스펙트하는 행성) · 층위 4 (6H로드와 결합·어스펙트하는\n\
      \  행성) — 어스펙트·결합 상대 판정 키 부재\n- 층위 6 (찬드라 라그나 기준 6H 로드) — 달 기준 하우스 재계산 키 부재 -\
      \ 층위 7 (나밤샤 6H 로드) — D9 하우스 로드 키 부재\n"
  d4_t4_transit:
    issue: COND-D-015
    reason: '15 §4.4 이중 트랜싯(토성·목성의 6H·6H로드·라그나 흉각/길각)과 §4.3 나밤샤 역배치 반전은 트랜싯·바르가 위치
      키가 없어 규칙화 불가.

      '
  d4_t6_roga:
    issue: COND-D-016
    reason: '15 §3.4 병증(로가) 조합(만성·급성·사고성)은 전부 "훼손 시" 조건이 필요해 규칙화 불가. §6.3 병증 확정 절차는
      의도적으로 규칙화하지 않음 (spec safety_rules, 기존 파일 blocked_63과 동형).

      '

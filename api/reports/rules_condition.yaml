meta:
  version: 2.0.0
  description: rules_condition — 심화판 (evidence map D1~D4)
  source: report_module-2 worksheet_spec.yaml evidence map + kb-sources 원전
  shallow_backup: _backup_shallow/
rules:
- id: R_D1_LAGNA_LORD_OWN
  tier: t1_d1
  conclusion: D1
  when:
    lord_dignity:
      lord_of: 1
      dignity: own
  direction: support
  source: 15_하우스6.md §5.3
  text: 라그나 로드가 자기 별자리에 있으면 체력·활력의 기본 그릇이 튼튼한 편으로 봅니다.
- id: R_D1_LAGNA_LORD_EXALTED
  tier: t1_d1
  conclusion: D1
  when:
    lord_dignity:
      lord_of: 1
      dignity: exalted
  direction: support
  source: 15_하우스6.md §5.3
  text: 라그나 로드가 고양된 자리에 있으면 체력·활력의 기본 그릇이 튼튼한 편으로 봅니다.
- id: R_D1_6L_IN_1H
  tier: t1_d1
  conclusion: D1
  when:
    lord_house:
      lord_of: 6
      in_house: 1
  direction: caution
  source: 15_하우스6.md §1
  text: 6하우스 로드가 라그나에 있으면 신체 자체가 병약하거나 저항력이 약한 편으로 봅니다. 체력 관리에 각별한 유의가 요구되는 국면입니다.
  note: '원문 "스스로 적을 만드는 성향"은 관계·커리어 영역이라 제외.

    '
- id: R_D1_6L_IN_2H
  tier: t1_d1
  conclusion: D1
  when:
    lord_house:
      lord_of: 6
      in_house: 2
  direction: caution
  source: 15_하우스6.md §1
  text: 6하우스 로드가 2하우스에 있으면 목소리·목 주변과 식습관 관련 리듬을 살펴볼 만합니다.
  note: 부채 관련 서술은 금전 카테고리로 이관 (§3.2).
- id: R_D1_6L_IN_4H
  tier: t1_d1
  conclusion: D1
  when:
    lord_house:
      lord_of: 6
      in_house: 4
  direction: neutral
  source: 15_하우스6.md §1
  text: 6하우스 로드가 4하우스에 있으면 가정 내 건강 관리에 관심을 두는 흐름으로 봅니다.
  note: 원문 '모친의 병약'은 가족 건강 영역이므로 완곡 서술.
- id: R_D1_6L_IN_6H
  tier: t1_d1
  conclusion: D1
  when:
    lord_house:
      lord_of: 6
      in_house: 6
  direction: support
  source: 15_하우스6.md §1
  text: 6하우스 로드가 자기 자리에 있으면 6하우스 주제가 뚜렷한 대신 극복하는 힘도 함께 강화되는 구조로 봅니다.
- id: R_D1_6L_IN_9H
  tier: t1_d1
  conclusion: D1
  when:
    lord_house:
      lord_of: 6
      in_house: 9
  direction: caution
  source: 15_하우스6.md §1
  text: 6하우스 로드가 9하우스에 있으면 장거리 이동 시 컨디션 난조에 유의하는 흐름으로 봅니다.
  note: 원문 '부친 병약'은 가족 건강 영역이므로 제외하고 이동 시 유의로 서술.
- id: R_D1_6H_SUN
  tier: t1_d1
  conclusion: D1
  when:
    planet_in_house:
      sun: 6
  direction: caution
  source: 15_하우스6.md §2
  text: 태양이 6하우스에 있으면 위장과 소화 관련 리듬을 살펴볼 만합니다. 식습관을 일정하게 유지하는 흐름을 검토할 수 있습니다.
  note: 관직·정부 관련 서술은 커리어로 이관.
- id: R_D1_6H_MOON
  tier: t1_d1
  conclusion: D1
  when:
    planet_in_house:
      moon: 6
  direction: caution
  source: 15_하우스6.md §2
  text: 달이 6하우스에 있으면 위장 쪽과 생활 리듬을 살펴볼 만합니다. 식사와 수면 시간을 일정하게 맞추는 흐름을 검토할 수 있습니다.
  note: '달 항목의 정신 건강 서술("우울·불안", "심각한 정신 건강 문제")은 본문 서술 금지 — active_referral 문구로 대체
    (워크시트/서술 단계).

    '
- id: R_D1_6H_MARS
  tier: t1_d1
  conclusion: D1
  when:
    planet_in_house:
      mars: 6
  direction: support
  source: 15_하우스6.md §2
  text: 화성이 6하우스에 있으면 강한 저항력과 극복력을 가진 배치로 봅니다.
  note: 루차카 마하푸루샤 요가 조건은 커리어 카테고리로 이관.
- id: R_D1_6H_SATURN
  tier: t1_d1
  conclusion: D1
  when:
    planet_in_house:
      saturn: 6
  direction: support
  source: 15_하우스6.md §2
  text: 토성이 6하우스에 있으면 만성적인 부담을 인내로 다스리는 배치로 봅니다.
- id: R_D1_6H_RAHU
  tier: t1_d1
  conclusion: D1
  when:
    planet_in_house:
      rahu: 6
  direction: support
  source: 15_하우스6.md §2
  text: 라후가 6하우스에 있으면 이례적인 방법으로 부담을 제압하는 우파차야적 배치로 봅니다.
  note: '§2 총원칙 "우파차야이므로 흉성이 6하우스에 있는 것은 상서로움" 적용. 손상 시(파파카르타리 등) 중독·독소 서술은 훼손 판정이
    필요해 제외.

    '
- id: R_D1_6H_KETU
  tier: t1_d1
  conclusion: D1
  when:
    planet_in_house:
      ketu: 6
  direction: caution
  source: 15_하우스6.md §2
  text: 케투가 6하우스에 있으면 원인 파악이 어려운 컨디션 난조에 유의하는 흐름으로 봅니다. 지속되면 의료기관 상담을 권유합니다.
  note: 병명 확정 금지 — '자가면역 질환' 등 손상 시 병명은 제외.
- id: R_D1_6L_D1_D9_CONTRAST
  tier: t3_varga
  conclusion: D1
  when:
    varga_contrast:
      planet: lord_of_6
      vargas:
      - d9
  direction: neutral
  source: 41_BPHS_바르가판독_1_.md §3.6
  text: 6하우스 로드의 D1·D9 강약 비교 — 체력 기반의 잠재력과 실제 발현 조건을 함께 봅니다.
  automation: partial
  automation_note: '"강함/약함" 판정에는 존엄·하우스 성격 규칙이 필요 — 후보를 제시하고 사람이 확정한다.

    '
- id: R_D1_SAV_6H
  tier: t5_ashtaka
  conclusion: D1
  when:
    sav_house:
      house: 6
  direction: support
  grade_threshold: 28
  source: 15_하우스6.md §4.5
  text: 6하우스의 아쉬타카바르가 점수가 28점을 넘으면 부담을 다루는 힘이 강하게 받쳐 주는 구조로 봅니다.
  note: 28점 초과 = 극복력 강함. 등급 문자열은 constants.yaml sav_grades 조회.
- id: R_D1_SAV_1H
  tier: t5_ashtaka
  conclusion: D1
  when:
    sav_house:
      house: 1
  direction: support
  grade_threshold: 28
  source: 43_BPHS_아쉬타카바르가.md §5.2
  text: 1하우스(라그나)의 아쉬타카바르가 점수가 28점을 넘으면 몸의 기본 바탕이 안정적으로 받쳐 주는 구조로 봅니다.
  note: 라그나=신체 자체. SAV 는 발현의 수용력·마찰 정도만 보조한다.
- id: R_D2_6L_DEBILITATED
  tier: t1_d1
  conclusion: D2
  when:
    lord_dignity:
      lord_of: 6
      dignity: debilitated
  direction: support
  source: 15_하우스6.md §5.3
  text: 6하우스 로드가 쇠약한 자리에 있으면 부담을 주는 요인이 약해 다스리기 수월한 구조로 봅니다.
  note: '§5.3 완전 비교(위엄·하우스 배치·결합/어스펙트·AV 4항목 종합)는 자동화 불가 — 본 규칙은 위엄 1항목만의 부분 판정이며
    라그나 로드와의 상대 비교는 사람이 확정한다.

    '
- id: R_D2_6L_EXALTED
  tier: t1_d1
  conclusion: D2
  when:
    lord_dignity:
      lord_of: 6
      dignity: exalted
  direction: caution
  source: 15_하우스6.md §5.3
  text: 6하우스 로드가 고양된 자리에 있으면 6하우스 주제의 힘이 강해 예방과 관리를 강조하는 흐름으로 봅니다.
  note: §5.3 '라그나 로드 < 6H 로드 → 적·병이 native를 압도, 예방과 관리 강조'의 부분 판정.
- id: R_D2_6L_OWN_SIGN
  tier: t1_d1
  conclusion: D2
  when:
    lord_dignity:
      lord_of: 6
      dignity: own
  direction: support
  source: 15_하우스6.md §5.3
  text: 6하우스 로드가 자기 별자리의 힘으로 있으면 부담을 다스리는 저력이 있는 구조로 봅니다.
  note: §5.3 부분 판정 — 라그나 로드와의 상대 비교는 사람이 확정한다.
- id: R_D2_ARISHTA_MARS
  tier: t6_yoga
  conclusion: D2
  when:
    yoga:
      planet: mars
      signs:
      - 1
      - 8
      - 10
      houses:
      - 6
  direction: support
  source: 15_하우스6.md §3.5
  text: 아리스타 방가(위기 소멸) — 화성이 자기·고양 위치로 6하우스에 있어 위기·고비를 넘기는 회복탄력성의 구조로 봅니다.
- id: R_D2_ARISHTA_SATURN
  tier: t6_yoga
  conclusion: D2
  when:
    yoga:
      planet: saturn
      signs:
      - 10
      - 11
      houses:
      - 6
  direction: support
  source: 15_하우스6.md §3.5
  text: 아리스타 방가(위기 소멸) — 토성이 자기 별자리로 6하우스에 있어 만성적인 부담을 인내로 극복하는 구조로 봅니다.
- id: R_D2_HARSHA_8
  tier: t6_yoga
  conclusion: D2
  when:
    lord_house:
      lord_of: 6
      in_house: 8
  direction: support
  source: 15_하우스6.md §3.1
  text: 하르샤 요가 성립 조건 — 위기를 통과한 뒤 도약하는 극복 구조로 봅니다.
  automation: partial
  automation_note: '순수성 체크리스트(§3.1: 6·8·12 로드끼리만 결합·어스펙트, 켄드라·트리코나 로드와 결합 없음, 다른 로드십을
    겸하지 않음)는 엔진 미산출 — 후보를 제시하고 사람이 확정한다.

    '
- id: R_D2_HARSHA_12
  tier: t6_yoga
  conclusion: D2
  when:
    lord_house:
      lord_of: 6
      in_house: 12
  direction: support
  source: 15_하우스6.md §3.1
  text: 하르샤 요가 성립 조건 — 위기를 통과한 뒤 도약하는 극복 구조로 봅니다.
  automation: partial
  automation_note: 순수성 체크리스트(§3.1)는 엔진 미산출 — 후보를 제시하고 사람이 확정한다.
- id: R_D2_SARALA_6
  tier: t6_yoga
  conclusion: D2
  when:
    lord_house:
      lord_of: 8
      in_house: 6
  direction: support
  source: 15_하우스6.md §3.1
  text: 사랄라 요가 성립 조건 — 위기를 통과한 뒤 도약하는 극복 구조로 봅니다.
  automation: partial
  automation_note: 순수성 체크리스트(§3.1)는 엔진 미산출 — 후보를 제시하고 사람이 확정한다.
- id: R_D2_SARALA_12
  tier: t6_yoga
  conclusion: D2
  when:
    lord_house:
      lord_of: 8
      in_house: 12
  direction: support
  source: 15_하우스6.md §3.1
  text: 사랄라 요가 성립 조건 — 위기를 통과한 뒤 도약하는 극복 구조로 봅니다.
  automation: partial
  automation_note: 순수성 체크리스트(§3.1)는 엔진 미산출 — 후보를 제시하고 사람이 확정한다.
- id: R_D2_VIMALA_6
  tier: t6_yoga
  conclusion: D2
  when:
    lord_house:
      lord_of: 12
      in_house: 6
  direction: support
  source: 15_하우스6.md §3.1
  text: 비말라 요가 성립 조건 — 위기를 통과한 뒤 도약하는 극복 구조로 봅니다.
  automation: partial
  automation_note: 순수성 체크리스트(§3.1)는 엔진 미산출 — 후보를 제시하고 사람이 확정한다.
- id: R_D2_VIMALA_8
  tier: t6_yoga
  conclusion: D2
  when:
    lord_house:
      lord_of: 12
      in_house: 8
  direction: support
  source: 15_하우스6.md §3.1
  text: 비말라 요가 성립 조건 — 위기를 통과한 뒤 도약하는 극복 구조로 봅니다.
  automation: partial
  automation_note: 순수성 체크리스트(§3.1)는 엔진 미산출 — 후보를 제시하고 사람이 확정한다.
- id: R_D2_HARSHA_TIMING
  tier: t4_dasha
  conclusion: D2
  when:
    lord_house:
      lord_of: 6
      in_house: 8
    maha_lord_of: 6
  direction: support
  source: 15_하우스6.md §3.1
  text: 하르샤 요가 관련 시기로, 6하우스 로드의 다샤에서 위기가 기회로 전환되는 흐름을 검토할 수 있습니다.
  automation: partial
  automation_note: 요가 순수성(§3.1)은 사람이 확정해야 한다.
- id: R_D2_SARALA_TIMING
  tier: t4_dasha
  conclusion: D2
  when:
    lord_house:
      lord_of: 8
      in_house: 6
    maha_lord_of: 8
  direction: support
  source: 15_하우스6.md §3.1
  text: 사랄라 요가 관련 시기로, 8하우스 로드의 다샤에서 위기를 통과해 도약하는 흐름을 검토할 수 있습니다.
  automation: partial
  automation_note: 요가 순수성(§3.1)은 사람이 확정해야 한다.
- id: R_D2_VIMALA_TIMING
  tier: t4_dasha
  conclusion: D2
  when:
    lord_house:
      lord_of: 12
      in_house: 6
    maha_lord_of: 12
  direction: support
  source: 15_하우스6.md §3.1
  text: 비말라 요가 관련 시기로, 12하우스 로드의 다샤에서 부담을 정리하고 도약하는 흐름을 검토할 수 있습니다.
  automation: partial
  automation_note: 요가 순수성(§3.1)은 사람이 확정해야 한다.
- id: R_D3_MOON_RHYTHM
  tier: t1_d1
  conclusion: D3
  when:
    planet_in_house:
      moon: 6
  direction: caution
  source: 15_하우스6.md §2
  text: 달이 6하우스에 있으면 수면과 식사 시간이 흐트러지기 쉬운 리듬으로 봅니다. 취침·기상 시간을 일정하게 유지하는 흐름을 검토할 수 있습니다.
- id: R_D3_SUN_DIGEST_RHYTHM
  tier: t1_d1
  conclusion: D3
  when:
    planet_in_house:
      sun: 6
  direction: neutral
  source: 15_하우스6.md §2
  text: 태양이 6하우스에 있으면 소화 리듬을 일정하게 유지하는 흐름을 검토할 수 있습니다.
- id: R_D3_6L_IN_1H_RHYTHM
  tier: t1_d1
  conclusion: D3
  when:
    lord_house:
      lord_of: 6
      in_house: 1
  direction: caution
  source: 15_하우스6.md §1
  text: 6하우스 로드가 라그나에 있으면 체력 소모가 빠른 편으로 봅니다. 무리한 일정을 피하고 회복 시간을 확보하는 흐름을 검토할 수 있습니다.
- id: R_D3_SATURN_TOIL
  tier: t2_karaka
  conclusion: D3
  when:
    planet_in_house:
      saturn: 6
  direction: caution
  source: 15_하우스6.md §2
  text: 토성이 6하우스에 있으면 장시간·반복적인 노고가 쌓이기 쉬운 리듬으로 봅니다. 휴식 시간을 의도적으로 확보하는 흐름을 검토할 수 있습니다.
  note: spec karakas 토성(만성) + 헤더 '일상의 노고'의 생활 언어 번역.
- id: R_D3_MARS_ENERGY
  tier: t2_karaka
  conclusion: D3
  when:
    planet_in_house:
      mars: 6
  direction: neutral
  source: 15_하우스6.md §2
  text: 화성이 6하우스에 있으면 에너지가 한 번에 분출되기 쉬운 패턴으로 봅니다. 활동과 회복의 배분 리듬을 살펴볼 수 있습니다.
- id: R_D3_RAHU_RHYTHM
  tier: t2_karaka
  conclusion: D3
  when:
    planet_in_house:
